  const selectField = (key, label, options) => {
    const current = project[key]||"";
    return (
      <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
        <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>
        <select value={current} onChange={e=>onUpdate(pid,{[key]:e.target.value})}
          style={{fontSize:13,padding:"5px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:current?"var(--color-text-primary)":"var(--color-text-tertiary)"}}>
          <option value="">— not set —</option>
          {options.map(o=><option key={o}>{o}</option>)}
        </select>
      </div>
    );
  };

  const toggleBtns = (key, label, options) => {
    const current = project[key]||"";
    return (
      <div style={{display:"flex",flexDirection:"column",gap:4}}>
        <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>
        <div style={{display:"flex",gap:6}}>
          {options.map(v=>{ const sel=current===v; return <button key={v} onClick={()=>onUpdate(pid,{[key]:v})} style={{flex:1,padding:"5px 4px",borderRadius:"var(--border-radius-md)",border:sel?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",background:sel?"var(--color-background-info)":"transparent",color:sel?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:11,fontWeight:sel?500:400,cursor:"pointer"}}>{v}</button>; })}
        </div>
      </div>
    );
  };

  const sectionHead = (label, action=null) => (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,marginTop:4,paddingBottom:6,borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
      <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:"0.07em"}}>{label}</span>
      {action}
    </div>
  );

  // ── Port helpers ──────────────────────────────────────────────────────────
  function updatePort(iface, col, value) {
    onUpdate(pid, {ports: {...ports, [iface]: {...(ports[iface]||{}), [col]: value}}});
  }
  function copyPort(iface, col, value) {
    if (!value) return;
    navigator.clipboard?.writeText(value).catch(()=>{});
    const key = `${iface}-${col}`;
    setCopiedCell(key);
    setTimeout(()=>setCopiedCell(null), 1200);
  }

  // ── Contact helpers ───────────────────────────────────────────────────────
  function openNewContact()  { setContactForm({name:"",role:"",email:"",phone:""}); setEditContact("new"); }
  function openEditContact(c){ setContactForm({name:c.name,role:c.role,email:c.email,phone:c.phone}); setEditContact(c.id); }
  function cancelContact()   { setEditContact(null); }
  function saveContact() {
    if (!contactForm.name.trim() && !contactForm.role.trim()) return;
    if (editContact==="new") {
      onUpdate(pid,{contacts:[...contacts,{...contactForm,id:genId()}]});
    } else {
      onUpdate(pid,{contacts:contacts.map(c=>c.id===editContact?{...c,...contactForm}:c)});
    }
    setEditContact(null);
  }
  function deleteContact(id) { onUpdate(pid,{contacts:contacts.filter(c=>c.id!==id)}); }

  const inputStyle = {fontSize:12,padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",outline:"none",width:"100%"};

  return (
    <div style={{display:"grid",gap:16}}>

      {/* ── Project Phase Timeline ────────────────────────────── */}
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
        {sectionHead("Project phase")}
        <div style={{display:"flex",alignItems:"center",gap:0,overflowX:"auto"}}>
          {PROJECT_PHASES.map((ph,i)=>{
            const cur  = project.currentPhase??0;
            const done = i < cur;
            const active = i === cur;
            const future = i > cur;
            return (
              <div key={ph.id} style={{display:"flex",alignItems:"center",flex:i<PROJECT_PHASES.length-1?1:"none"}}>
                <button onClick={()=>onUpdatePhase&&onUpdatePhase(ph.id)} title={`Set phase: ${ph.label}`} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,background:"none",border:"none",cursor:"pointer",padding:"4px 6px",flexShrink:0}}>
                  <div style={{width:28,height:28,borderRadius:"50%",border:active?"2px solid #1d4ed8":done?"2px solid #22c55e":"1.5px solid var(--color-border-secondary)",background:active?"#1d4ed8":done?"#22c55e":"var(--color-background-secondary)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:600,color:active||done?"#fff":"var(--color-text-tertiary)",transition:"all 0.2s"}}>
                    {done?"✓":ph.id}
                  </div>
                  <span style={{fontSize:9,fontFamily:"var(--font-mono)",textTransform:"uppercase",letterSpacing:"0.04em",color:active?"#1d4ed8":done?"#22c55e":"var(--color-text-tertiary)",whiteSpace:"nowrap",fontWeight:active?600:400}}>
                    {ph.short}
                  </span>
                </button>
                {i<PROJECT_PHASES.length-1&&(
                  <div style={{flex:1,height:2,background:done?"#22c55e":active?"linear-gradient(90deg,#22c55e 50%,var(--color-border-secondary) 50%)":"var(--color-border-secondary)",minWidth:8,transition:"background 0.2s"}} />
                )}
              </div>
            );
          })}
        </div>
        <p style={{fontSize:11,color:"var(--color-text-tertiary)",margin:"10px 0 0",lineHeight:1.5}}>
          Current: <strong style={{color:"#1d4ed8"}}>{PROJECT_PHASES[project.currentPhase??0]?.label||"—"}</strong> — click any phase to jump to it
        </p>
      </div>

      {/* ── Project Setup ─────────────────────────────────────── */}
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
        {sectionHead("Project setup")}
        <div style={{display:"grid",gridTemplateColumns:compact?"1fr":"1fr 1fr",gap:12}}>
          {field("hospitalSoftware","Hospital software / EHR")}
          {selectField("timeZone","Time zone",["Eastern (ET)","Central (CT)","Mountain (MT)","Pacific (PT)","Alaska (AKT)","Hawaii (HT)"])}
          {toggleBtns("connectivity","Connectivity",["VPN","Relay / API","Both"])}
          {toggleBtns("implementations","Implementations?",["Yes","No","Unknown"])}
          {field("managementCompany","Management company / whitelabeling")}
          {field("account","Account / facility name")}
          {field("assignedHow","Assigned when & how")}
        </div>
      </div>

      {/* ── Facility IDs ──────────────────────────────────────── */}
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
        {sectionHead("Facility IDs")}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {field("facilityIdTest","Facility ID — TEST")}
          {field("facilityIdProd","Facility ID — PROD")}
        </div>
        <p style={{fontSize:11,color:"var(--color-text-tertiary)",margin:"10px 0 0",lineHeight:1.5}}>
          Used in SQL queries, Minion Server config, and interface templates. Click any field to edit inline.
        </p>
      </div>

      {/* ── Ports Table ───────────────────────────────────────── */}
      {ifaceRows.length>0 && (
        <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
          {sectionHead("Interfaces & ports")}
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr>
                  <th style={{textAlign:"left",padding:"0 8px 8px 0",fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.05em",width:80}}>Interface</th>
                  {PORT_COLS.map(col=>(
                    <th key={col.key} style={{textAlign:"left",padding:"0 4px 8px",fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.05em"}}>
                      {col.label}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {ifaceRows.map((iface,ri)=>{
                  const c = INTERFACE_COLORS[iface];
                  return (
                    <tr key={iface} style={{borderTop:"0.5px solid var(--color-border-tertiary)"}}>
                      <td style={{padding:"8px 8px 8px 0",verticalAlign:"middle"}}>
                        <span style={{fontSize:11,fontFamily:"var(--font-mono)",fontWeight:500,padding:"2px 7px",borderRadius:4,background:c.bg,color:c.text}}>{iface}</span>
                      </td>
                      {PORT_COLS.map(col=>{
                        const cellKey = `${iface}-${col.key}`;
                        const portVal = ports[iface]?.[col.key]||"";
                        const copied  = copiedCell===cellKey;
                        return (
                          <td key={col.key} style={{padding:"6px 4px",verticalAlign:"middle"}}>
                            <div style={{display:"flex",alignItems:"center",gap:4}}>
                              <input
                                value={portVal}
                                onChange={e=>updatePort(iface,col.key,e.target.value)}
                                placeholder="—"
                                style={{width:compact?70:86,fontSize:12,fontFamily:"var(--font-mono)",padding:"5px 7px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:portVal?"var(--color-text-primary)":"var(--color-text-tertiary)",outline:"none",transition:"border 0.12s"}}
                                onFocus={e=>e.target.style.borderColor="var(--color-border-info)"}
                                onBlur={e=>e.target.style.borderColor="var(--color-border-secondary)"}
                              />
                              {portVal && (
                                <button
                                  onClick={()=>copyPort(iface,col.key,portVal)}
                                  title="Copy port"
                                  style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:copied?"var(--color-text-success)":"var(--color-text-tertiary)",padding:"2px",flexShrink:0,transition:"color 0.2s"}}
                                >{copied?"✓":"📋"}</button>
                              )}
                            </div>
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <p style={{fontSize:11,color:"var(--color-text-tertiary)",margin:"10px 0 0",lineHeight:1.5}}>
            Enter port numbers as you allocate them. Click 📋 on any filled cell to copy it to clipboard.
          </p>
        </div>
      )}

      {/* ── Contacts ──────────────────────────────────────────── */}
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
        {sectionHead("Contacts",
          editContact!=="new" && (
            <button onClick={openNewContact} style={{fontSize:11,padding:"3px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
              + Add contact
            </button>
          )
        )}

        {/* Add / Edit contact form */}
        {editContact && (
          <div style={{background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-info)",borderRadius:"var(--border-radius-lg)",padding:"12px",marginBottom:12}}>
            <div style={{fontSize:11,fontWeight:500,color:"var(--color-text-info)",marginBottom:10}}>
              {editContact==="new"?"New contact":"Edit contact"}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
              <div>
                <label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Name *</label>
                <input value={contactForm.name} onChange={e=>setContactForm(f=>({...f,name:e.target.value}))} placeholder="Full name" style={inputStyle} />
              </div>
              <div>
                <label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Role</label>
                <input value={contactForm.role} onChange={e=>setContactForm(f=>({...f,role:e.target.value}))} placeholder="e.g. Clinical Lead" style={inputStyle} list="role-suggestions" />
                <datalist id="role-suggestions">{ROLE_SUGGESTIONS.map(r=><option key={r} value={r} />)}</datalist>
              </div>
              <div>
                <label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Email</label>
                <input value={contactForm.email} onChange={e=>setContactForm(f=>({...f,email:e.target.value}))} placeholder="email@facility.com" type="email" style={inputStyle} />
              </div>
              <div>
                <label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Phone</label>
                <input value={contactForm.phone} onChange={e=>setContactForm(f=>({...f,phone:e.target.value}))} placeholder="(optional)" style={inputStyle} />
              </div>
            </div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
              <button onClick={cancelContact} style={{padding:"5px 14px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"transparent",color:"var(--color-text-secondary)",fontSize:12,cursor:"pointer"}}>Cancel</button>
              <button onClick={saveContact} disabled={!contactForm.name.trim()} style={{padding:"5px 14px",border:"none",borderRadius:"var(--border-radius-md)",background:contactForm.name.trim()?"var(--color-background-info)":"var(--color-background-secondary)",color:contactForm.name.trim()?"var(--color-text-info)":"var(--color-text-tertiary)",fontSize:12,cursor:contactForm.name.trim()?"pointer":"default",fontWeight:500}}>
                {editContact==="new"?"Add contact":"Save changes"}
              </button>
            </div>
          </div>
        )}

        {/* Contact list */}
        {contacts.length===0 && editContact!=="new" && (
          <div style={{textAlign:"center",padding:"20px 0",color:"var(--color-text-tertiary)",fontSize:12}}>
            No contacts yet — add clinical, technical, network, and billing contacts as you gather them.
          </div>
        )}

        <div style={{display:"grid",gap:8}}>
          {contacts.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"flex-start",gap:12,padding:"10px 12px",background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-tertiary)"}}>
              {/* Avatar */}
              <div style={{width:32,height:32,borderRadius:"50%",background:"var(--color-background-info)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:600,color:"var(--color-text-info)",flexShrink:0}}>
                {(c.name||"?").trim().split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
              </div>
              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:13,fontWeight:500,color:"var(--color-text-primary)"}}>{c.name||"—"}</span>
                  {c.role && <span style={{fontSize:11,padding:"1px 7px",borderRadius:20,background:"var(--color-background-tertiary)",color:"var(--color-text-secondary)"}}>{c.role}</span>}
                </div>
                <div style={{display:"flex",gap:12,marginTop:4,flexWrap:"wrap"}}>
                  {c.email && (
                    <a href={`mailto:${c.email}`} style={{fontSize:11,color:"var(--color-text-info)",textDecoration:"none",display:"flex",alignItems:"center",gap:3}} onClick={e=>e.stopPropagation()}>
                      ✉ {c.email}
                    </a>
                  )}
                  {c.phone && <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>📞 {c.phone}</span>}
                </div>
              </div>
              {/* Actions */}
              {editContact!==c.id && (
                <div style={{display:"flex",gap:4,flexShrink:0}}>
                  <button onClick={()=>openEditContact(c)} title="Edit" style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",padding:"3px 5px",borderRadius:4,fontSize:13}}>✏️</button>
                  <button onClick={()=>deleteContact(c.id)} title="Remove" style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",padding:"3px 5px",borderRadius:4,fontSize:13}}>✕</button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* ── Interface progress ─────────────────────────────────── */}
      {ifaceRows.length>0 && (
        <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"16px"}}>
          {sectionHead("Interface progress")}
          <div style={{display:"grid",gap:10}}>
            {ifaceRows.map(t=>{
              const c  = INTERFACE_COLORS[t];
              const cl = project.checklists?.[t]||[];
              const p2 = pct(cl);
              const done = cl.filter(i=>i.done).length;
              return (
                <div key={t} style={{display:"flex",alignItems:"center",gap:12}}>
                  <span style={{fontSize:11,fontFamily:"var(--font-mono)",fontWeight:500,color:c.text,width:60,flexShrink:0}}>{t}</span>
                  <div style={{flex:1}}>
                    <div style={{height:5,background:"var(--color-background-tertiary)",borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",width:`${p2}%`,background:c.text,borderRadius:3,transition:"width 0.3s"}} />
                    </div>
                  </div>
                  <span style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",width:72,flexShrink:0,textAlign:"right"}}>{done}/{cl.length} · {p2}%</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

    </div>
  );
}


// ─── EditForm ──────────────────────────────────────────────────────────────────
function EditForm({project,settings,activeProfile,onSave,onCancel}) {
  const storedIfaces=(project?.interfaces||[]).filter(t=>t!=="General");
  const [form,setForm]=useState({
    id:              project?.id            || null,
    projectType:     project?.projectType   || "New Interface",
    name:            project?.name          || "",
    projectNumber:   project?.projectNumber || "",
    account:         project?.account       || "",
    status:          project?.status        || "Work in Progress",
    goLiveDate:      project?.goLiveDate    || "",
    assignee:        project?.assignee      || settings.defaultEngineer || "SG",
    interfaces:      storedIfaces,
    assignedHow:       project?.assignedHow        || "",
    // Metadata fields (known at creation)
    hospitalSoftware:  project?.hospitalSoftware  || "",
    timeZone:          project?.timeZone          || "",
    connectivity:      project?.connectivity      || "",
    managementCompany: project?.managementCompany || "",
    implementations:   project?.implementations   || "Unknown",
  });
  const isOtherAssignee=!ENGINEERS.includes(form.assignee);
  const valid=form.name.trim().length>0;
  const typeChanged=project&&project.projectType!==form.projectType;
  function toggle(type){ setForm(f=>({...f,interfaces:f.interfaces.includes(type)?f.interfaces.filter(t=>t!==type):[...f.interfaces,type]})); }

  return (
    <div style={{padding:"20px",maxWidth:520}}>
      <h3 style={{margin:"0 0 22px",fontSize:15,fontWeight:500,color:"var(--color-text-primary)"}}>{project?"Edit project":"New project"}</h3>
      <div style={{display:"grid",gap:14}}>
        {/* Project type */}
        <div>
          <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:8}}>Project type</span>
          <div style={{display:"flex",gap:8}}>
            {PROJECT_TYPES.map(t=>{const sel=form.projectType===t;return <button key={t} onClick={()=>setForm(f=>({...f,projectType:t}))} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"9px 14px",borderRadius:"var(--border-radius-md)",border:sel?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",background:sel?"var(--color-background-info)":"transparent",color:sel?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:12,fontWeight:sel?500:400,cursor:"pointer"}}><i className={`ti ${t==="New Interface"?"ti-plug-connected":"ti-arrows-exchange"}`} style={{fontSize:13}} />{t}</button>;})}
          </div>
          {typeChanged&&<div style={{marginTop:6,fontSize:11,color:"var(--color-text-danger)",display:"flex",alignItems:"center",gap:5}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>⚠️</span>Changing project type will reset the General checklist.</div>}
        </div>
        <label style={{display:"block"}}><span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Project name *</span><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. HCA Florida Gainesville Hospital" style={{width:"100%"}} /></label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <label style={{display:"block"}}><span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>PR number</span><input value={form.projectNumber} onChange={e=>setForm(f=>({...f,projectNumber:e.target.value}))} placeholder="PR-XXXXX" style={{width:"100%",fontFamily:"var(--font-mono)"}} /></label>
          <label style={{display:"block"}}><span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Account / facility</span><input value={form.account} onChange={e=>setForm(f=>({...f,account:e.target.value}))} style={{width:"100%"}} /></label>
        </div>
        <label style={{display:"block"}}>
          <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Assigned when &amp; how</span>
          <input value={form.assignedHow} onChange={e=>setForm(f=>({...f,assignedHow:e.target.value}))} placeholder="e.g. Assigned by Laura 5/15 via Slack" style={{width:"100%"}} />
        </label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <label style={{display:"block"}}><span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Status</span><select value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))} style={{width:"100%"}}><option>Work in Progress</option><option>Live</option><option>On Hold</option></select></label>
          <label style={{display:"block"}}><span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Go-live date</span><input type="date" value={form.goLiveDate} onChange={e=>setForm(f=>({...f,goLiveDate:e.target.value}))} style={{width:"100%"}} /></label>
        </div>
        <div>
          <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Assigned engineer</span>
          <div style={{display:"flex",gap:8}}>
            <select value={isOtherAssignee?"Other":form.assignee} onChange={e=>setForm(f=>({...f,assignee:e.target.value==="Other"?"":e.target.value}))} style={{flex:1,padding:"7px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",fontSize:12}}>
              {ENGINEERS.map(e=><option key={e}>{e}</option>)}<option value="Other">Other…</option>
            </select>
            {isOtherAssignee&&<input value={form.assignee} onChange={e=>setForm(f=>({...f,assignee:e.target.value}))} placeholder="Initials" style={{width:80,padding:"7px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",fontSize:12,fontFamily:"var(--font-mono)",outline:"none"}} />}
          </div>
        </div>
        {/* ── Metadata fields ─────────────────────────────────────────── */}
        <div style={{borderTop:"0.5px solid var(--color-border-tertiary)",paddingTop:14,marginTop:2}}>
          <div style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:12}}>Project details</div>
          <div style={{display:"grid",gap:12}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <label style={{display:"block"}}>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Hospital software / EHR</span>
                <input value={form.hospitalSoftware} onChange={e=>setForm(f=>({...f,hospitalSoftware:e.target.value}))} placeholder="e.g. Epic, Meditech, Cerner" style={{width:"100%"}} />
              </label>
              <label style={{display:"block"}}>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Time zone</span>
                <select value={form.timeZone} onChange={e=>setForm(f=>({...f,timeZone:e.target.value}))} style={{width:"100%"}}>
                  <option value="">— Select —</option>
                  <option>Eastern (ET)</option>
                  <option>Central (CT)</option>
                  <option>Mountain (MT)</option>
                  <option>Pacific (PT)</option>
                  <option>Alaska (AKT)</option>
                  <option>Hawaii (HT)</option>
                </select>
              </label>
            </div>
            <div>
              <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:8}}>Connectivity type</span>
              <div style={{display:"flex",gap:7}}>
                {["VPN","Relay / API","Both"].map(c=>{
                  const sel=form.connectivity===c;
                  return <button key={c} onClick={()=>setForm(f=>({...f,connectivity:c}))} style={{flex:1,padding:"6px 8px",borderRadius:"var(--border-radius-md)",border:sel?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",background:sel?"var(--color-background-info)":"transparent",color:sel?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:11,fontWeight:sel?500:400,cursor:"pointer"}}>{c}</button>;
                })}
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}}>
              <label style={{display:"block"}}>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:5}}>Management company / whitelabeling</span>
                <input value={form.managementCompany} onChange={e=>setForm(f=>({...f,managementCompany:e.target.value}))} placeholder="e.g. Restorix, WCA, HCA" style={{width:"100%"}} />
              </label>
              <div>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:8}}>Implementations?</span>
                <div style={{display:"flex",gap:6}}>
                  {["Yes","No","Unknown"].map(v=>{
                    const sel=form.implementations===v;
                    return <button key={v} onClick={()=>setForm(f=>({...f,implementations:v}))} style={{flex:1,padding:"6px 4px",borderRadius:"var(--border-radius-md)",border:sel?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",background:sel?"var(--color-background-info)":"transparent",color:sel?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:11,fontWeight:sel?500:400,cursor:"pointer"}}>{v}</button>;
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ── Interfaces ─────────────────────────────────────────────────── */}
        <div>
          <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:8}}>Interfaces in scope</span>
          <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
            {SELECTABLE_INTERFACES.map(t=>{const sel=form.interfaces.includes(t);const c=INTERFACE_COLORS[t];return <button key={t} onClick={()=>toggle(t)} style={{padding:"6px 16px",borderRadius:"var(--border-radius-md)",border:sel?`2px solid ${c.border}`:"0.5px solid var(--color-border-secondary)",background:sel?c.bg:"transparent",color:sel?c.text:"var(--color-text-secondary)",fontSize:12,fontWeight:sel?500:400,cursor:"pointer",fontFamily:"var(--font-mono)"}}>{t}</button>;})}
          </div>
          <div style={{marginTop:8,fontSize:11,color:"var(--color-text-tertiary)",display:"flex",alignItems:"center",gap:5}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>🔌</span>The General tab is always included on every project.</div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:26,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"8px 18px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",fontSize:13,cursor:"pointer",color:"var(--color-text-primary)"}}>Cancel</button>
        <button onClick={()=>valid&&onSave(form)} style={{padding:"8px 20px",borderRadius:"var(--border-radius-md)",border:"none",background:valid?"var(--color-background-info)":"var(--color-background-secondary)",fontSize:13,cursor:valid?"pointer":"default",color:valid?"var(--color-text-info)":"var(--color-text-tertiary)",fontWeight:500,opacity:valid?1:0.6}}>{project?"Save changes":"Create project"} ↗</button>
      </div>
    </div>
  );
}

    { title:"Recurring Logic in Solution Variables", body:"Set up recurring logic in Solution Variables:\n  WC → IN: 'WC', OUT: 'True'\n\nIf 'AccountsRecurring' = 'Mapped', check the Data Mapping tab under T2 to see what drives the value." },
    { title:"PV1.3 Mapping — HBO Accounts", body:"PV1.3 (Point of Care) can be mapped to both Account.Recurring and Account.VisitTypeIDList simultaneously.\n\nBuild a second Lookup Table with valid HBO visit type IDs — the app handles the rest. If no mapping info is provided, that portion of the API call won't be built." },
    { title:"Check 'Self' for Insurance", body:"When reviewing patient insurance data from the client, always check what value they send for 'Self' (the relationship field). They may send a code like 'S' instead of the display name 'Self' — which means you'll need a lookup table entry." },
  ]},
  { id:"siu", category:"📅 SIU / Scheduling", tips:[
    { title:"Account Numbers — SIU vs ADT", body:"Account numbers can come from either SIU or ADT, but must come from ONE source only — never both.\n\nWe prefer SIU as the source of truth for account information. When SIU is in scope:\n  1. Confirm whether the client already has an ADT interface\n  2. If ADT + SIU: un-map account number info from ADT — SIU takes over\n  3. Set Solution Variable AddPatientOnDefault to False in the ADT solution (SIU creates patients now — ADT creating them too causes duplicates)" },
    { title:"SIU Setup — Step by Step", body:"1. Confirm if client has ADT — if so, see ADT + SIU section\n2. Gather information on what they will send through SIU\n3. Ask for a list of Visit Types they will send, with their WoundExpert equivalents\n4. Run the Visit Type query (see below) and send results to the client to match\n5. Create a new SIU template on Minion Server — enter the listening port and facility ID\n6. Set up visit type mapping in the solution\n7. Schedule the SIU test call" },
    { title:"ADT + SIU Combo — Required Changes", body:"When both ADT and SIU are active on the same facility:\n\n1. Un-map Account Number from ADT solution — SIU is the source of truth\n2. In the ADT custom task, uncomment time.sleep(10) — this adds a delay so SIU processes account info before ADT runs. If there is no code to uncomment, add time to the Import section under message = newMessage\n3. Set ADT Solution Variable: AddPatientOnDefault = False. If True, ADT creates new patients when new info arrives — but SIU is doing this now, so we don't want duplicates\n\nFailure to do these steps will result in duplicate patient records and incorrect account number sourcing." },
    { title:"Visit Types — Mapping Rules", body:"Allowed mappings (many-to-one and one-to-one are both fine):\n  Client Type A  →  WE Visit Type 1\n  Client Type B  →  WE Visit Type 1  (many-to-one: OK)\n  Client Type C  →  WE Visit Type 2  (one-to-one: OK)\n\nNOT allowed:\n  Client Type A  →  WE Visit Type 1 AND WE Visit Type 2  (one-to-many: NOT allowed)\n\nFor HBO accounts: build a second lookup table with valid HBO visit type IDs. The app handles the rest once the VisitTypeIDList is populated." },
    { title:"Visit Type Query — Step 3", body:"Paste the facilityID into @FacilityListStr before running. Returns the available visit types for that facility. Send the output to the client for them to match their system's visit types to WoundExpert equivalents.", code:"DECLARE @TableSuffix nvarchar(50)\nDECLARE @FacilityListStr nvarchar(50)\nDECLARE @currFacilityID int\nDECLARE @nextFacilityID int\nDECLARE @end int\nDeclare @FacilityList Table (FacilityID Int)\nDeclare @FacilityList2 Table (FacilityID Int)\n\nSET @FacilityListStr = ''  -- paste facilityID here e.g. '1234'\n\nIf IsNull(@FacilityListStr, '') <> ''\nBegin\n    Declare @tempVal NVarChar(10)\n    While (CharIndex(',', @FacilityListStr) > 0)\n    Begin\n        Set @tempVal = SubString(@FacilityListStr, 0, CharIndex(',', @FacilityListStr))\n        Insert Into @FacilityList (FacilityID) Values(Cast(@tempVal As Int))\n        Set @FacilityListStr = SubString(@FacilityListStr, CharIndex(',', @FacilityListStr) + 1, Len(@FacilityListStr) - CharIndex(',', @FacilityListStr))\n    End\n    If (Len(@FacilityListStr) > 0)\n        Insert Into @FacilityList (FacilityID) Values(Cast(@FacilityListStr As Int))\nEnd\n\nDeclare c_Placeholder Cursor For SELECT FacilityID FROM @FacilityList\nOpen c_Placeholder\nFetch Next From c_Placeholder Into @currFacilityID\nWhile (@@Fetch_Status = 0)\nBegin\n    INSERT INTO @FacilityList2 (FacilityID) VALUES (@currFacilityID)\n    SET @end = 0\n    While @end = 0\n    Begin\n        SELECT @nextFacilityID = ISNULL(parentFacilityID, @currFacilityID) FROM tbl_Facility where facilityid = @currFacilityID\n        if(@nextFacilityID != @currFacilityID)\n        Begin\n            INSERT INTO @FacilityList2 (FacilityID) VALUES (@nextFacilityID)\n            SET @currFacilityID = @nextFacilityID\n        End\n        else Set @end = 1\n    End\n    Fetch Next From c_Placeholder Into @currFacilityID\nEnd\nClose c_Placeholder\nDeallocate c_Placeholder\n\nIf Not Exists(\n    Select 1 From tbl_FacilityCode\n    Where codeTable = 'VisitType' and removeItem Is Null\n    and FacilityID IN (SELECT FacilityID FROM @FacilityList2)\n)\nBegin\n    Select Code, CodeValue from tbl_CODE_VisitType\n    Where Not Exists (\n        Select * From tbl_FacilityCode\n        Where codeTable = 'VisitType' And addItem = 1\n        And tbl_FacilityCode.Item = tbl_Code_VisitType.Code\n    )\n    Order By CodeValue\nEnd\nElse\nBegin\n    Select Code, CodeValue from tbl_CODE_VisitType Where Exists (\n        Select * From tbl_FacilityCode\n        Where facilityID IN (SELECT FacilityID FROM @FacilityList2)\n        And codeTable = 'VisitType'\n        And tbl_FacilityCode.Item = tbl_Code_VisitType.Code\n        and removeItem Is Null\n    )\n    Order By CodeValue\nEnd" },
    { title:"SIU Test Call — What to Cover", body:"Run through all of these scenarios during the test call:\n\n1. Create a new visit: \'Can you schedule the patient for a new visit?\'\n2. Verify fields they care about appear correctly in WoundExpert (visit type, clinician, physician)\n3. Reschedule: \'Can you reschedule the visit to change the visit type?\'\n4. Change time: \'Try changing the time of the visit\'\n5. Ask: \'What information in the calendar do you see reflected in the test appointment?\'\n6. Move the visit\n7. Cancel: \'Try cancelling that same visit\'\n\nIf the client can\'t see a physician and expects to, have them retry in their registration system (Meditech, Epic, etc.)" },
    { title:"FacilityAppointmentID — SCH.1 vs SCH.2", body:"A unique identifier specifies each visit. This is sometimes mapped to SCH.1 when it should be SCH.2 (or vice versa).\n\nAsk the client: \'Are you sending a Placer ID in SCH.1, or a Filler ID in SCH.2?\'\n\nIf the wrong field is mapped:\n  - Primary matching uses FacilityAppointmentID\n  - If no match is found, it may fall back to secondary visit matching\n  - If that also fails, it creates a brand new visit (duplicate)\n  - Duplicated visits must be manually deleted\n  - The client won\'t see duplicates on their side and won\'t know the ID is wrong — you have to catch this\n\ntech = facility billing, pro = physician billing" },
    { title:"Duplicate Visits", body:"Cause: The interface looks for a visit match using FacilityAppointmentID. If it can\'t find one (because SCH.1/SCH.2 is mapped to the wrong field), it creates a new visit instead of updating the existing one.\n\nFlow:\n  1. Match by FacilityAppointmentID (primary)\n  2. Fall back to secondary visit match (if enabled)\n  3. If both fail: new visit created = DUPLICATE\n\nDuplicated visits must be manually deleted — there is no automated cleanup.\nClients won\'t see the duplicates on their side.\n\nIf a visit disappears entirely, check if \'Clear Visits\' was triggered." },
    { title:"Active Date & Account Number Display", body:"If the client does not send an active date in their SIU messages, the account number section in WoundExpert will display as \'Other\' instead of the correct account type.\n\nAlways verify the active date is being sent and populated correctly during test calls." },
  ]},
  { id:"results", category:"🧪 Unsolicited Results", tips:[
    { title:"How It Works", body:"We receive results from the client — we don't request them. The client sends whatever they configure on their end. We only update WoundExpert if we find a patient match." },
    { title:"Result Types We Handle", body:"We receive three types:\n  • Labs (Laboratory results)\n  • Rads (Radiology results)\n  • Micros (Microbiology results)\n\nYou may need separate contacts from each department — Lab, Radiology, and Microbiology may each have different technical contacts." },
    { title:"Same vs Different Lab Software", body:"Same lab software as an existing interface → minimal changes needed, adapt the existing setup.\n\nDifferent lab software → start from scratch. It's easier than trying to force-fit the old configuration." },
    { title:"Filtering", body:"Always ask the client: 'How will results be filtered on your end?'\n\nCommon methods:\n  • By ordering provider\n  • Only wound care-specific result types\n  • Another custom method\n\nMake sure only relevant results are crossing — not everything from their lab system." },
    { title:"Physician Orders & Versioning", body:"When configuring physician orders:\n  • Do NOT check 'Referred Away'\n  • Filler number must be unique for versioning to work correctly" },
    { title:"Getting Started", body:"Steps:\n1. Get the full list of all wound care tests the client currently orders\n2. Request sample HL7 messages for lab, rad, and micro\n3. Confirm filtering approach\n4. Verify lab software (same = adapt, different = rebuild)\n5. Send all types to test environment\n6. Manually verify and fix each result type in test\n7. Confirm filtering — only wound care results should cross" },
  ]},
  { id:"pcc", category:"🏥 PCC Integration", tips:[
    { title:"PCC Overview — How It Works", body:"PCC is a separate integration type from HL7 — it goes through the PCC Marketplace (not a VPN or Relay).\n\nThe integration process can ONLY begin once the facility requests activation through the PCC Marketplace themselves. We cannot initiate it on their behalf.\n\nCoC (Component of Care) activation takes the longest — prioritize requesting the CoC list from the client as early as possible." },
    { title:"PM Assignment — Who Does What", body:"Before doing anything, check if a Project Manager is assigned:\n\n  PM assigned and it is NOT you: Do NOT communicate directly with the client. The PM handles everything.\n\n  PM assigned and it IS you: Proceed with all steps below." },
    { title:"Step 1 — Initial Client Email (PM Only)", body:"Send an introductory email that includes:\n\n  1. Overview of the PCC Marketplace\n  2. CoC Requests — ask for the list of CoCs the client needs to integrate with (this takes the longest, prioritize it)\n  3. The PCC Client Elections Worksheet to collect their configuration selections\n  4. Attach:\n     - Email Template for the facility (copy-paste only, do not send the PDF itself)\n     - Self-Service Activation for Marketplace Applications Quick Reference Guide\n     - Activation Form Fields Key\n\nIMPORTANT: In the Activation Form, the client\'s BUSINESS NAME must go in the Healthcare Provider field — NOT their facility name." },
    { title:"Step 2 — Election Sheet Selections to Collect", body:"The Elections Worksheet asks the client to choose:\n\nTrigger Selection:\n  - Signature Requirements\n  - Finalize Visits\n\nPCC Configuration Options:\n  - New Patient Creation\n  - Import MRN\n  - Import Provider Data\n\nDocuments to Cross:\n  - Physician Document Information\n\nAll of these feed directly into the system setup steps." },
    { title:"Step 3 — System Setup (After Receiving Election Sheet)", body:"Once client elections are confirmed, complete these four setup areas in WoundExpert:\n\n1. Enable PCC in Facility Preferences (FP):\n   - Select the appropriate trigger (Finalize Visits or Signature Requirements)\n\n2. Document Views Setup:\n   - Navigate to Facility > Doc Views\n   - Create a New View\n   - Set file format (default: PCC_PN_{0}_{3}.pdf — may vary by client)\n   - Add all client-selected documents\n   - Configure signature settings for each doc being sent\n\n3. Interoperability Integrations:\n   - Go to Integrations Admin\n   - Apply the configuration the client selected (Create Patient, Import MRNs, etc.)\n\n4. CoC Integration:\n   - Proceed with the CoC Addition Process using the information gathered" },
    { title:"CoC (Component of Care) Process", body:"CoC activation is the longest step in a PCC integration — always request the CoC list from the client as the very first thing.\n\nSteps:\n  1. Request the list of CoCs from the client in the initial email\n  2. Wait for client to provide the CoC list\n  3. Proceed with CoC Addition Process per standard procedure\n  4. CoC must be active before the integration can go live" },
    { title:"PCC File Format", body:"Default doc view file format: PCC_PN_{0}_{3}.pdf\n\nThis format may vary by client — always confirm with the client whether they need a different naming convention. Configure this in the Doc View setup step." },
  ]},
  { id:"vc-notes", category:"🔄 Vendor Conversion", tips:[
    { title:"VC Scoping Questions", body:"Ask all of these during your initial VC scoping discussion:\n\n  1. What is the target go-live date?\n  2. What EHR are they moving TO, and what EHR are they coming FROM?\n  3. Do they have interface specs for the new EHR? (Determines if we need to build new interfaces)\n  4. Do they require an MRN number conversion? (They must provide the mapping data)\n  5. Do they require a new CDM (Charge Description Master)?\n  6. What format do they require docs to be re-sent in? (HL7 Base64, SFTP, SMB)\n  7. Will accounts continue to be recurring or episodic on the new system?\n  8. On go-live, will they transition active patients from one EHR to another?\n  9. What is their connectivity setup for the new system? (VPN info, IP addresses)" },
    { title:"MRN Conversion Options", body:"Option 1 (Preferred): WE exports the patient list, client returns it with new MRNs, we run the conversion sproc on go-live night.\n\n  - Export: SELECT patientID, PatientFName, PatientLName, cast(PatientDOB as date), patientnumber FROM tbl_patient WHERE facilityid = X AND recActive = 1\n  - Sproc: EXEC hl7.sp_UpdatePatientMRN \'<facility_id>\', \'<WE_patientid>\', \'<new_mrn>\'\n\nOption 2: Rely on secondary matching (less reliable).\n\nWe do NOT accept MRN lists FROM clients. We send our list; they return it with new MRNs mapped." },
    { title:"Billing Cutoff & Recurring Accounts", body:"Billing interface cutoff date: No charges from dates of service prior to go-live should cross the billing interface after cutover.\n\nRecurring accounts: If Prevent Overlapping is ON, old accounts auto-discharge when new ones arrive.\nMake sure the client plans to discharge old account numbers — especially if recurring and Prevent Overlapping is OFF." },
    { title:"Cutover Night Checklist", body:"In order:\n  1. Client starts queuing ADT messages in new system\n  2. We send the final MRN conversion list to client\n  3. Client returns list with new MRNs\n  4. We validate the file (patientid + new MRN, check for column mismatches)\n  5. Clinicians stop documenting in WoundExpert\n  6. Run billing interface early (captures last charges from old system)\n  7. Old system sends final ADT (confirm recurring accounts discharge)\n  8. Take old interfaces down\n  9. Run MRN conversion sproc in production\n  10. Bring new interfaces to prod\n  11. Apply any ClinDoc FileRouter or facility preference changes\n  12. Verify first ADT from new system\n  13. Load new CDM from test to prod\n  14. Load new doc views from test to prod\n  15. Facility admin re-configures Document Options (Clinic level of care, Other Procedures, Skin Sub)\n  16. Clinicians resume documenting" },
  ]},
  { id:"clindoc", category:"📄 ClinDoc", tips:[
    { title:"Overview — Delivery Methods (Decide This FIRST)", body:"Before building anything, confirm the delivery method with the client. The two main options:\n\n1. Cold Feed — just sending a file, nothing more\n   - SFTP: no VPN tunnel required\n   - SMB / FTP: requires a VPN tunnel\n\n2. 64-bit Encoded PDF in an HL7 message\n   - Message type: ORU or MDM (ask which they want — see HL7 tip below)\n   - Transfer via TCP/IP\n\nWe cannot provide plaintext. We do not offer communication through our API for ClinDoc.\n\nFor Relays: the client would pull PDFs off our API over HTTPS (only if a prior discussion confirmed this)." },
    { title:"VPN & Connectivity", body:"VPN is required for ALL ClinDoc interfaces EXCEPT SFTP.\n\n- If the client is new with no existing VPN tunnel: a new one is needed — send the VPN questionnaire\n- If they already have a tunnel from another interface: reuse it, no new tunnel needed\n\nPort & IP: ClinDoc is OUTBOUND. We send to the client, so they must provide:\n  - Destination IP address\n  - Port to send to\n\nAsk the client early: \'Where are we sending this to?\'" },
    { title:"Step 1 — Document Discovery (Pre-Excel Query)", body:"Run the \'Interface -- PreExcel\' saved query in Laura\'s Queries to get a list of all documents available for that facility (types of wound care documents set up at that facility).\n\nCopy and paste the output into Excel, then send it to the client and ask them to fill in columns D and E:\n  - Column D: Mnemonic — used if they are receiving an HL7 message (gets embedded in the message). For Cold Feeds, column D doesn\'t matter; the filename carries the info instead.\n  - Column E: Whether they want that document sent\n\nProvide the example Excel file alongside the output for guidance.\n\nNote: If a user has no workflows configured, go to their profile, add a workflow in workflow config, then try entering the visit again." },
    { title:"Step 2 — Documentation Views Setup", body:"Each selected document corresponds to a Doc View. One Doc View can include multiple document types.\n\nDefault file format: {0}_docType_{2}.pdf\n  - {0} = Visit ID\n  - {docType} = replace with the actual document type name\n  - {2} = Account Number\n\nThe mnemonic does NOT need the {} brackets — just the name itself.\n\nSpecial formats:\n  - Meditech Cold Feed: {2}_doctype_{0}_{3}{4}_{1}.pdf\n  - PCC: PCC_PN_{0}_{3}.pdf (anything else will cause the FileRouter to fail — do not change this for PCC)\n\nClient probably won\'t see the file format with HL7, but with Cold Feed the metadata contains the filename — so get it right from the start." },
    { title:"Step 3 — Folder Setup (Minion Server)", body:"In the ClinDoc template, copy the \'xxxx\' folder from ClientResultsFiles and rename it to the facilityID you are using.\n\nPin this folder to your Minion Server instance.\n\nFiles will move from this directory into Archive once they have been processed successfully." },
    { title:"Step 4 — Triggers", body:"Two trigger options to configure:\n\n1. Signature Requirements\n   - Documents won\'t cross until the appropriate person signs (see Form Signature Requirements page)\n   - Do NOT advise the client on what signature requirement is necessary — their HIM department handles that\n   - If \'Finalize Visit PDF Interface\' is set to NO in facility preferences, they are using signature requirements\n   - If a client thinks they are meeting requirements but documents aren\'t crossing, you\'ll need to troubleshoot why the requirements aren\'t being met\n\n2. Finalize Visit\n   - If \'Finalize Visit PDF Interface\' is set to YES, they are using finalize visit\n   - A user must be granted \'Finalize Visit User\' access in User Setup for that facility\n   - If the checkbox is greyed out, check the Finalize Visit Admin page first\n\nIMPORTANT: Disable the Finalize trigger in PROD until ClinDoc go-live — prevents the client (e.g. WCA) from requesting a premature re-send." },
    { title:"Step 5 — HL7 Message Options (ORU vs MDM)", body:"If the client is receiving an HL7 message (not Cold Feed):\n\nAsk: \'Would you like ORU or MDM?\'\n  - MDM and ORU have different naming conventions for some segments\n  - Once confirmed, delete the unused message type from the template (click and drag to delete)\n  - The encoded PDF lives in the OBX segment as a Base64 string\n\nIn the template setup:\n  - E74 kicks things off — it uses the polling interval to check what is in the folder, and if there is content, it triggers the rest of the interface\n  - For Cold Feed: we are listening for a file in a directory\n  - For HL7: we listen on a port" },
    { title:"Step 6 — Build the Interface (Template Selection)", body:"Choose the correct ClinDoc template based on what the client selected in step 1:\n\n  - ClinDocTemplate - encoded pdf (Base64 HL7, most common)\n  - ClinDocTemplate - Cold Feed\n  - ClinDocTemplate - Relay\n  - ClinDocTemplate - CHS\n  - ClinDocTemplate - HL7 message with PDF link\n\nSave steps:\n  1. Rename the solution to Test or Prod\n  2. Move it OUT of the template or test folder\n  3. Tortoise save and push to master\n  4. Restart or start the solution in the Monitor" },
    { title:"Step 7 — Enable in Facility Preferences", body:"After the build, enable in facility preferences:\n\n  \'PDF Results Interface\' (labeled $$ PDF Results Interface in the UI) = documentation interface. Must be enabled.\n\nFormat: set up the test interface first, then set up doc views and signatures, then enable the results interface in facility preferences." },
    { title:"Testing ClinDoc", body:"Best practice: ask the client to submit documentation BEFORE the test call, so you can show them the RVR (Reconciliation Report) page during the call and confirm documents are crossing on your end.\n\nTest flow:\n  1. Start a visit\n  2. Create/send a document of the type specified in the Doc View\n  3. Finalize the visit (or sign, depending on trigger)\n  4. Check the Reconciliation Report to confirm it crossed\n\nIf a test patient doesn\'t have an account number, the client must register a new account number for that test patient before testing can continue." },
    { title:"Client Communication — What You Own vs What You Don\'t", body:"What you own:\n  - Explaining delivery method options and WoundExpert functionality\n  - Setting up the interface based on client\'s choices\n  - Troubleshooting why a document isn\'t crossing\n\nWhat you DON\'T own:\n  - Advising on which signature requirement is necessary (that\'s the client\'s HIM department)\n  - Deciding which documents belong to which doc view (advise on options, let them decide)\n\nAlways frame it as: \'If you set it up this way... vs. if you set it up that way...\' — explain the options, don\'t prescribe.\n\nThe interface engineer OR a records specialist internal to the hospital should be on the call — they will understand the options.\n\nIf they want to host on our SFTP server: encourage them to use their own instead." },
    { title:"Duplicate Doc Views — Two Views Sending at Once", body:"If the client complains that two doc views are sending simultaneously when a document belongs to both:\n\nThis is expected WoundExpert behavior — there are no limitations preventing a document from appearing in multiple doc views. If a document is in a doc view and it is submitted, that doc view will fire.\n\nAdvise the client to clarify which doc view each document should belong to. Frame it as options, not instructions — it\'s their decision." },
    { title:"Aliasing Issues", body:"If you\'re having trouble with aliasing, it almost always means something is wrong with how the documentation views are named. Ask the client what the doc views are called and verify the names match exactly." },
    { title:"ClinDoc Go-Live", body:"When taking a ClinDoc interface live, run the stored procedure:\n  CopyDocumentationViewSetup\n\nThis copies the documentation view configuration from test to prod." },
  ]},
  { id:"connectivity", category:"🔌 Connectivity", tips:[
    { title:"What to Offer First — API vs VPN", body:"Always offer API first:\n'If your interface engine can communicate via HTTPS, we have a WoundExpert API that's more modern and more secure than TCP/IP traffic over a VPN. I can provide a spec document with more details.'\n\nIf rejected:\n'No problem — we can also use a VPN. Here's the questionnaire for your network team to fill out.'\n\nOur WoundExpert public IP: 206.210.72.13" },
    { title:"Port Assignment Rules", body:"Inbound (ADT, SIU) — We pick the port, add it to the shared port list (SharePoint → WoundExpert tab → end of list), then communicate it to the client.\n\nOutbound (Billing, ClinDoc) — The client tells us which port to send to." },
    { title:"VPN Ticket Process", body:"After receiving the completed VPN questionnaire:\n1. Open a Platform ticket\n2. Navigate: 'Something affecting clients' → 'Service performed' → 'VPN creation/modification' → 'New VPN'\n3. Drag and drop the completed form into the ticket\n4. Name the ticket: [Hospital Name] VPN\n\nUse this same path if the VPN goes down later." },
    { title:"After VPN is Built", body:"Algert confirms and may get the client on a call for networking verification. Once confirmed, you can stand up the interface using the assigned ports.\n\nAs long as our interface is up and listening, networking issues are not our responsibility — reach out to Algert to check if we're getting any responses. If the client's network team is blocking our attempts, tell them and they fix it on their end." },
    { title:"First Call Script", body:"'My name is [Your Name]. I'm the interface engineer on this project. I'll be building the interface and helping with testing. I'm not the network engineer, but if there are any networking issues, I'll get our network team involved. I'll be your main point of contact.'\n\nDuring introductions:\n  'Let's go around and state our names, job titles, and what we're responsible for.'\n\nThen:\n  - Confirm which hospital/registration system they use\n  - Discuss connectivity preference (API or VPN)\n  - 'Is this time good for weekly calls going forward?'\n  - 'Did you put in a ticket on your side to start the VPN tunnel?'" },
  ]},
];

  { id:"clindoc-doc-selection", title:"ClinDoc — Document Selection", tags:["ClinDoc"],
    subject:"ClinDoc Interface Setup – Document Selection – [Facility Name]",
    body:`Hello,

As we move forward with the ClinDoc interface setup, the next step is to identify which documents you would like us to send.

I have run a query against your WoundExpert facility to pull the full list of documents currently available. Please see the attached Excel file.

What we need from you:
• Column D – Mnemonic: If you are receiving an HL7 message, please provide the mnemonic (short label) for each document type. If you are receiving a Cold Feed, this column is optional.

// ─── DocsPage ─────────────────────────────────────────────────────────────────
function DocsPage({onBack, activeProfile}) {
  const [tab,             setTab]             = useState("tips");
  const [expandedTip,     setExpandedTip]     = useState(null);
  const [expandedCat,     setExpandedCat]     = useState("quickref");
  const [copiedId,        setCopiedId]        = useState(null);
  const [templateSearch,  setTemplateSearch]  = useState("");
  const [tipSearch,       setTipSearch]       = useState("");
  const [expandedTemplate,setExpandedTemplate]= useState(null);
  const [customTips,      setCustomTips]      = useState([]);
  const [showAddTip,      setShowAddTip]      = useState(false);
  const [tipForm,         setTipForm]         = useState({title:"", body:"", code:""});
  const [expandedCustom,  setExpandedCustom]  = useState(null);
  const [tipOverrides,    setTipOverrides]    = useState({}); // key: catId-tipIdx → {title,body,code}
  const [tipLinks,        setTipLinks]        = useState({}); // key: catId-tipIdx or customId → [{id,name,url}]
  const [editingBuiltIn,  setEditingBuiltIn]  = useState(null); // tipKey being edited
  const [builtInForm,     setBuiltInForm]     = useState({title:"",body:"",code:""});
  const [addingLinkKey,   setAddingLinkKey]   = useState(null); // tipKey getting a link
  const [linkForm,        setLinkForm]        = useState({name:"",url:""});

  // Load custom tips, overrides, and file links from shared storage
  useEffect(() => {
    (async () => {
      try {
        const [cr, or, lr] = await Promise.allSettled([
          window.storage.get("wce_custom_tips",   true),
          window.storage.get("wce_tip_overrides", true),
          window.storage.get("wce_tip_links",     true),
        ]);
        if (cr.status==="fulfilled" && cr.value?.value) setCustomTips(JSON.parse(cr.value.value));
        if (or.status==="fulfilled" && or.value?.value) setTipOverrides(JSON.parse(or.value.value));
        if (lr.status==="fulfilled" && lr.value?.value) setTipLinks(JSON.parse(lr.value.value));
      } catch {}
    })();
  }, []);

  async function saveTipOverride(tipKey, fields) {
    const updated = {...tipOverrides, [tipKey]: fields};
    setTipOverrides(updated);
    try { await window.storage.set("wce_tip_overrides", JSON.stringify(updated), true); } catch {}
    setEditingBuiltIn(null);
  }
  async function resetTipOverride(tipKey) {
    const {[tipKey]:_, ...rest} = tipOverrides;
    setTipOverrides(rest);
    try { await window.storage.set("wce_tip_overrides", JSON.stringify(rest), true); } catch {}
    setEditingBuiltIn(null);
  }
  async function addTipLink(tipKey) {
    if (!linkForm.name.trim() || !linkForm.url.trim()) return;
    const entry = {id: Date.now().toString(36), name: linkForm.name.trim(), url: linkForm.url.trim()};
    const updated = {...tipLinks, [tipKey]: [...(tipLinks[tipKey]||[]), entry]};
    setTipLinks(updated);
    try { await window.storage.set("wce_tip_links", JSON.stringify(updated), true); } catch {}
    setAddingLinkKey(null);
    setLinkForm({name:"", url:""});
  }
  async function removeTipLink(tipKey, linkId) {
    const updated = {...tipLinks, [tipKey]: (tipLinks[tipKey]||[]).filter(l=>l.id!==linkId)};
    setTipLinks(updated);
    try { await window.storage.set("wce_tip_links", JSON.stringify(updated), true); } catch {}
  }

  async function saveCustomTip() {
    if (!tipForm.title.trim() || !tipForm.body.trim()) return;
    const tip = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
      title: tipForm.title.trim(),
      body:  tipForm.body.trim(),
      code:  tipForm.code.trim(),
      author: activeProfile?.name || "?",
      createdAt: new Date().toISOString(),
    };
    const updated = [tip, ...customTips];
    setCustomTips(updated);
    try { await window.storage.set("wce_custom_tips", JSON.stringify(updated), true); } catch {}
    setTipForm({title:"", body:"", code:""});
    setShowAddTip(false);
  }

  async function deleteCustomTip(id) {
    const updated = customTips.filter(t => t.id !== id);
    setCustomTips(updated);
    try { await window.storage.set("wce_custom_tips", JSON.stringify(updated), true); } catch {}
  }

  async function editCustomTip(id, updated) {
    const list = customTips.map(t => t.id === id ? {...t, ...updated, editedAt: new Date().toISOString()} : t);
    setCustomTips(list);
    try { await window.storage.set("wce_custom_tips", JSON.stringify(list), true); } catch {}
  }

  function copyText(text, id) {
    // Try modern clipboard API first, fall back to execCommand
    const doFlash = () => { setCopiedId(id); setTimeout(()=>setCopiedId(null), 1800); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(doFlash).catch(()=>legacyCopy(text, doFlash));
    } else {
      legacyCopy(text, doFlash);
    }
  }
  function legacyCopy(text, cb) {
    const el = document.createElement("textarea");
    el.value = text;
    el.setAttribute("readonly","");
    el.style.cssText = "position:fixed;left:-9999px;top:-9999px;opacity:0";
    document.body.appendChild(el);
    el.select();
    el.setSelectionRange(0, el.value.length);
    try { document.execCommand("copy"); cb(); } catch(e) { console.warn("Copy failed",e); }
    document.body.removeChild(el);
  }

  const filteredTips = tipSearch
    ? TIPS_DATA.map(cat=>({...cat, tips:cat.tips.filter(t=>
        t.title.toLowerCase().includes(tipSearch.toLowerCase()) ||
        t.body.toLowerCase().includes(tipSearch.toLowerCase()) ||
        (t.code||"").toLowerCase().includes(tipSearch.toLowerCase())

      {label}

        </button>
        <h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500,color:"var(--color-text-primary)"}}>📖 Reference</h2>
        <p style={{margin:0,fontSize:12,color:"var(--color-text-tertiary)"}}>Interface tips, troubleshooting notes, and copy-ready email templates</p>
      </div>

      {/* Tabs */}
      <div style={{borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",gap:2,marginBottom:20}}>
        {tabBtn("tips","💡 Tips & Notes")}
        {tabBtn("templates","✉️ Email Templates")}
      </div>

      {/* ── TIPS TAB ──────────────────────────────────────────── */}
      {tab==="tips" && (
        <div>
          {/* Search + Add tip button row */}
          <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
            <div style={{flex:1,display:"flex",alignItems:"center",gap:8,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",padding:"7px 10px"}}>
              <span style={{fontSize:13,color:"var(--color-text-tertiary)",flexShrink:0}}>🔍</span>
              <input value={tipSearch} onChange={e=>setTipSearch(e.target.value)} placeholder="Search tips…" style={{background:"transparent",border:"none",outline:"none",fontSize:12,color:"var(--color-text-primary)",width:"100%"}} />
              {tipSearch&&<button onClick={()=>setTipSearch("")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",fontSize:12,padding:0}}>✕</button>}
            </div>
            <button onClick={()=>{setShowAddTip(s=>!s);setTipForm({title:"",body:"",code:""}); }} style={{display:"flex",alignItems:"center",gap:5,padding:"7px 14px",border:showAddTip?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:showAddTip?"var(--color-background-info)":"var(--color-background-secondary)",color:showAddTip?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:12,cursor:"pointer",fontWeight:showAddTip?500:400,whiteSpace:"nowrap",flexShrink:0}}>
              ✍️ {showAddTip?"Cancel":"Add tip"}
            </button>
          </div>

          {/* Inline Add Tip form */}
