                                      <div key={l.id} style={{display:"flex",alignItems:"center",gap:4,background:"#eff6ff",borderRadius:20,padding:"2px 6px 2px 10px"}}>
                                        <a href={l.url} target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:"#1d4ed8",textDecoration:"none"}}>📎 {l.name}</a>
                                        <button onClick={()=>removeTipLink(tipKey,l.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:10,color:"#93c5fd",padding:"0 2px",lineHeight:1}}>✕</button>
                                      </div>
                                    ))}
                                  </div>
                                )}
                                {addingLinkKey===tipKey?(
                                  <div style={{background:"var(--color-background-tertiary)",borderRadius:"var(--border-radius-md)",padding:"10px",marginBottom:8}}>
                                    <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:6,marginBottom:6}}>
                                      <input value={linkForm.name} onChange={e=>setLinkForm(f=>({...f,name:e.target.value}))} placeholder="Label (e.g. Template Excel)" style={iS}/>
                                      <input value={linkForm.url} onChange={e=>setLinkForm(f=>({...f,url:e.target.value}))} placeholder="URL or SharePoint link" style={iS}/>
                                    </div>
                                    <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                                      <button onClick={()=>{setAddingLinkKey(null);setLinkForm({name:"",url:""});}} style={{padding:"4px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"transparent",fontSize:11,cursor:"pointer",color:"var(--color-text-secondary)"}}>Cancel</button>
                                      <button onClick={()=>addTipLink(tipKey)} disabled={!linkForm.name.trim()||!linkForm.url.trim()} style={{padding:"4px 10px",border:"none",borderRadius:"var(--border-radius-md)",background:linkForm.name.trim()&&linkForm.url.trim()?"#eff6ff":"var(--color-background-secondary)",color:linkForm.name.trim()&&linkForm.url.trim()?"#1d4ed8":"var(--color-text-tertiary)",fontSize:11,cursor:linkForm.name.trim()&&linkForm.url.trim()?"pointer":"default"}}>Add link</button>
                                    </div>
                                  </div>
                                ):(
                                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:6}}>
                                    <button onClick={()=>{setAddingLinkKey(tipKey);setLinkForm({name:"",url:""}); }} style={{background:"none",border:"0.5px dashed var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontSize:11,color:"var(--color-text-tertiary)",padding:"3px 8px",display:"flex",alignItems:"center",gap:4}}>+ 📎 Attach link</button>
                                    <div style={{display:"flex",gap:6}}>
                                      {isEdited&&<button onClick={()=>resetTipOverride(tipKey)} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:"var(--color-text-tertiary)",padding:"2px 4px"}}>↺ Reset</button>}
                                      <button onClick={()=>{setEditingBuiltIn(tipKey);setBuiltInForm({title:displayTitle,body:displayBody,code:displayCode||""}); }} style={{background:"none",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",cursor:"pointer",fontSize:11,color:"var(--color-text-secondary)",padding:"3px 8px"}}>✏️ Edit</button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            )}
                            {isExpanded&&isEditing&&(
                              <div style={{padding:"12px 16px",background:"var(--color-background-secondary)",borderTop:"0.5px solid var(--color-border-info)"}}>
                                <div style={{fontSize:11,fontWeight:500,color:"var(--color-text-info)",marginBottom:10}}>✏️ Editing — changes saved locally to your browser</div>
                                <div style={{display:"grid",gap:8,marginBottom:10}}>
                                  <div><label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Title</label><input value={builtInForm.title} onChange={e=>setBuiltInForm(f=>({...f,title:e.target.value}))} style={iS}/></div>
                                  <div><label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Content</label><textarea value={builtInForm.body} onChange={e=>setBuiltInForm(f=>({...f,body:e.target.value}))} rows={6} style={{...iS,resize:"vertical",fontFamily:"var(--font-sans)",lineHeight:1.6}}/></div>
                                  <div><label style={{fontSize:11,color:"var(--color-text-secondary)",display:"block",marginBottom:4}}>Code snippet <span style={{color:"var(--color-text-tertiary)"}}>(optional)</span></label><textarea value={builtInForm.code} onChange={e=>setBuiltInForm(f=>({...f,code:e.target.value}))} rows={3} style={{...iS,resize:"vertical",fontFamily:"var(--font-mono)",fontSize:11}}/></div>
                                </div>
                                <div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
                                  <button onClick={()=>setEditingBuiltIn(null)} style={{padding:"5px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"transparent",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>Cancel</button>
                                  {isEdited&&<button onClick={()=>resetTipOverride(tipKey)} style={{padding:"5px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"transparent",fontSize:12,cursor:"pointer",color:"var(--color-text-tertiary)"}}>↺ Restore original</button>}
                                  <button onClick={()=>saveTipOverride(tipKey,builtInForm)} style={{padding:"5px 14px",border:"none",borderRadius:"var(--border-radius-md)",background:"var(--color-background-info)",color:"var(--color-text-info)",fontSize:12,cursor:"pointer",fontWeight:500}}>Save changes</button>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ── TEMPLATES TAB ─────────────────────────────────────── */}
      {tab==="templates" && (
        <div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",padding:"7px 10px",marginBottom:16}}>
            <span style={{fontSize:13,color:"var(--color-text-tertiary)",flexShrink:0}}>🔍</span>
            <input value={templateSearch} onChange={e=>setTemplateSearch(e.target.value)} placeholder="Search templates…" style={{background:"transparent",border:"none",outline:"none",fontSize:12,color:"var(--color-text-primary)",width:"100%"}} />
            {templateSearch&&<button onClick={()=>setTemplateSearch("")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",fontSize:12,padding:0}}>✕</button>}
          </div>

          <p style={{fontSize:11,color:"var(--color-text-tertiary)",margin:"0 0 16px",lineHeight:1.6}}>
            Replace all <code style={{fontFamily:"var(--font-mono)",background:"var(--color-background-secondary)",padding:"1px 4px",borderRadius:3}}>[Placeholders]</code> with your project-specific values before sending. Click "Copy" to grab the full template.
          </p>

          <div style={{display:"grid",gap:12}}>
            {filteredTemplates.map(t=>{
              const fullText   = t.subject ? `Subject: ${t.subject}\n\n${t.body}` : t.body;
              const isExpanded = expandedTemplate === t.id;
              const isCopied   = copiedId === t.id;
              return (
                <div key={t.id} style={{background:"var(--color-background-primary)",border:`0.5px solid ${isExpanded?"var(--color-border-info)":"var(--color-border-tertiary)"}`,borderRadius:"var(--border-radius-lg)",overflow:"hidden",transition:"border-color 0.15s"}}>
                  {/* Header row */}
                  <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",padding:"13px 16px",gap:12,cursor:"pointer"}} onClick={()=>setExpandedTemplate(isExpanded?null:t.id)}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{fontSize:13,fontWeight:500,color:"var(--color-text-primary)"}}>{t.title}</span>
                        {t.tags.map(tag=>{
                          const c = tag==="All interfaces" ? null : INTERFACE_COLORS[tag];
                          return <span key={tag} style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:c?c.bg:"var(--color-background-secondary)",color:c?c.text:"var(--color-text-secondary)",fontFamily:"var(--font-mono)"}}>{tag}</span>;
                        })}
                      </div>
                      {t.subject && <div style={{fontSize:11,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>Subject: {t.subject}</div>}
                    </div>
                    <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
                      <button
                        onClick={e=>{e.stopPropagation();copyText(fullText,t.id);}}
                        style={{display:"flex",alignItems:"center",gap:5,padding:"6px 12px",border:`0.5px solid ${isCopied?"var(--color-border-success)":"var(--color-border-secondary)"}`,borderRadius:"var(--border-radius-md)",background:isCopied?"var(--color-background-success)":"var(--color-background-secondary)",color:isCopied?"var(--color-text-success)":"var(--color-text-secondary)",fontSize:12,cursor:"pointer",fontWeight:isCopied?500:400,transition:"all 0.2s",whiteSpace:"nowrap"}}
                      >{isCopied?"✓ Copied":"📋 Copy"}</button>
                      <span style={{color:"var(--color-text-tertiary)",fontSize:11,userSelect:"none"}}>{isExpanded?"▲":"▼"}</span>
                    </div>
                  </div>
                  {/* Expanded full email body */}
                  {isExpanded && (
                    <div style={{borderTop:"0.5px solid var(--color-border-tertiary)",padding:"12px 16px 14px",background:"var(--color-background-secondary)"}}>
                      {t.subject && (
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                          <span style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)"}}>Subject: {t.subject}</span>
                          <button onClick={()=>copyText(t.subject,t.id+"-subj")} style={{background:"none",border:"none",cursor:"pointer",color:copiedId===t.id+"-subj"?"var(--color-text-success)":"var(--color-text-tertiary)",fontSize:12,padding:"1px 4px"}}>
                            {copiedId===t.id+"-subj"?"✓":"📋 subject"}
                          </button>
                        </div>
                      )}
                      {/* Selectable full body — user can also manually select & copy */}
                      <textarea
                        readOnly
                        value={t.body}
                        onClick={e=>e.target.select()}
                        style={{width:"100%",minHeight:160,background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",padding:"10px 12px",fontSize:12,fontFamily:"var(--font-sans)",color:"var(--color-text-primary)",lineHeight:1.7,resize:"vertical",outline:"none",cursor:"text",boxSizing:"border-box"}}
                      />
                      <p style={{fontSize:11,color:"var(--color-text-tertiary)",margin:"6px 0 0"}}>
                        Click inside to select all text, or use the 📋 Copy button above.
                      </p>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── PrintPreviewModal ─────────────────────────────────────────────────────────
function PrintPreviewModal({ project, onClose }) {
  useEffect(() => {
    // Visibility trick: during print, hide everything EXCEPT the print target
    const el = document.createElement('style');
    el.id = 'wce-print-css';
    el.textContent = `
      @media print {
        body * { visibility: hidden !important; }
        #wce-print-target, #wce-print-target * { visibility: visible !important; }
        #wce-print-target { position: fixed !important; top: 0; left: 0; width: 100% !important; }
        #wce-print-topbar { display: none !important; }
      }
    `;
    document.head.appendChild(el);
    document.body.style.overflow = 'hidden';
    return () => { el.remove(); document.body.style.overflow = ''; };
  }, []);

  // Extract body content and CSS from buildPdfHtml
  const raw = buildPdfHtml(project);
  const bodyMatch = raw.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
  const bodyHtml  = bodyMatch ? bodyMatch[1].replace(/<script[\s\S]*?<\/script>/gi, '') : '';
  const cssMatch  = raw.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
  const css       = cssMatch ? cssMatch[1] : '';

  return (
    <div style={{
      position:'fixed', inset:0, zIndex:300,
      background:'#e5e7eb', display:'flex', flexDirection:'column'
    }}>
      {/* Top bar — hidden during print */}
      <div id="wce-print-topbar" style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'10px 20px', background:'var(--color-background-primary)',
        borderBottom:'0.5px solid var(--color-border-tertiary)', flexShrink:0,
        boxShadow:'0 1px 4px rgba(0,0,0,.08)'
      }}>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:14,fontWeight:500,color:'var(--color-text-primary)'}}>
            🖨️ Print Preview — {project.name}
          </span>
          {project.projectNumber && (
            <span style={{fontSize:11,fontFamily:'var(--font-mono)',color:'var(--color-text-tertiary)'}}>
              {project.projectNumber}
            </span>
          )}
        </div>
        <div style={{display:'flex',gap:8}}>
          <button
            onClick={() => window.print()}
            style={{display:'flex',alignItems:'center',gap:6,padding:'7px 16px',border:'none',
              borderRadius:'var(--border-radius-md)',background:'var(--color-background-info)',
              color:'var(--color-text-info)',fontSize:13,cursor:'pointer',fontWeight:500}}
          >
            🖨️ Print / Save as PDF
          </button>
          <button
            onClick={onClose}
            style={{display:'flex',alignItems:'center',gap:5,padding:'7px 14px',
              border:'0.5px solid var(--color-border-secondary)',borderRadius:'var(--border-radius-md)',
              background:'var(--color-background-secondary)',color:'var(--color-text-secondary)',
              fontSize:13,cursor:'pointer'}}
          >
            ✕ Close
          </button>
        </div>
      </div>

      {/* Hint bar */}
      <div style={{
        fontSize:11, color:'#6b7280', background:'#f9fafb',
        borderBottom:'0.5px solid #e5e7eb', padding:'6px 20px', flexShrink:0
      }}>
        ℹ️ Click <strong>Print / Save as PDF</strong> above, then choose <strong>Save as PDF</strong> as the destination in the print dialog.
      </div>

      {/* Scrollable content area */}
      <div style={{flex:1, overflow:'auto', padding:'24px 0'}}>
        <div
          id="wce-print-target"
          style={{
            maxWidth:860, margin:'0 auto', background:'white',
            padding:'36px 44px', borderRadius:6,
            boxShadow:'0 2px 12px rgba(0,0,0,.1)', minHeight:600
          }}
        >
          <style dangerouslySetInnerHTML={{__html: css}} />
          <div dangerouslySetInnerHTML={{__html: bodyHtml}} />
        </div>
      </div>
    </div>
  );
}

// ─── ProfileSelect ─────────────────────────────────────────────────────────────
function ProfileSelect({ profiles, onCreate, onSelect }) {
  const [mode,       setMode]       = useState(profiles.length === 0 ? "create" : "pick"); // "pick" | "create"
  const [name,       setName]       = useState("");
  const [color,      setColor]      = useState(PROFILE_COLORS[0]);
  const [creating,   setCreating]   = useState(false);

  const initials = name.trim().split(" ").filter(Boolean).map(w => w[0]).slice(0, 2).join("").toUpperCase();

  async function handleCreate() {
    if (!name.trim()) return;
    setCreating(true);
    await onCreate(name.trim(), color);
    setCreating(false);
  }

  return (
    <div style={{
      minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center",
      background:"var(--color-background-secondary)", padding:20
    }}>
      <div style={{
        width:"100%", maxWidth:440,
        background:"var(--color-background-primary)", borderRadius:16,
        border:"0.5px solid var(--color-border-tertiary)",
        boxShadow:"0 8px 40px rgba(0,0,0,.10)", overflow:"hidden"
      }}>
        {/* Header */}
        <div style={{padding:"28px 28px 20px", textAlign:"center", borderBottom:"0.5px solid var(--color-border-tertiary)"}}>
          <div style={{width:48,height:48,borderRadius:12,background:"var(--color-background-info)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",fontSize:24}}>
            🔗
          </div>
          <h2 style={{margin:"0 0 6px",fontSize:18,fontWeight:600,color:"var(--color-text-primary)"}}>
            WE Integration Hub
          </h2>
          <p style={{margin:0,fontSize:13,color:"var(--color-text-secondary)"}}>
            {mode === "pick" ? "Who are you?" : profiles.length === 0 ? "Create your profile to get started" : "Create a new profile"}
          </p>
        </div>

        <div style={{padding:"20px 28px 28px"}}>

          {/* PICK MODE: existing profiles */}
          {mode === "pick" && (
            <div>
              <div style={{display:"grid", gap:8, marginBottom:16}}>
                {profiles.map(p => {
                  const initials2 = p.name.trim().split(" ").filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
                  return (
                    <button key={p.id} onClick={() => onSelect(p)} style={{
                      display:"flex", alignItems:"center", gap:14, padding:"12px 14px",
                      border:"0.5px solid var(--color-border-secondary)", borderRadius:10,
                      background:"var(--color-background-secondary)", cursor:"pointer",
                      textAlign:"left", transition:"border-color 0.15s"
                    }}
                    onMouseEnter={e => e.currentTarget.style.borderColor = p.color}
                    onMouseLeave={e => e.currentTarget.style.borderColor = "var(--color-border-secondary)"}
                    >
                      <div style={{width:40,height:40,borderRadius:"50%",background:p.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color:"#fff",flexShrink:0}}>
                        {initials2}
                      </div>
                      <div>
                        <div style={{fontSize:14,fontWeight:500,color:"var(--color-text-primary)"}}>{p.name}</div>
                        <div style={{fontSize:11,color:"var(--color-text-tertiary)"}}>
                          Created {new Date(p.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
                        </div>
                      </div>
                      <span style={{marginLeft:"auto",fontSize:18,color:"var(--color-text-tertiary)"}}>→</span>
                    </button>
                  );
                })}
              </div>
              <button onClick={() => setMode("create")} style={{
                width:"100%", padding:"11px", border:"0.5px dashed var(--color-border-primary)",
                borderRadius:10, background:"transparent", cursor:"pointer", fontSize:13,
                color:"var(--color-text-secondary)", display:"flex", alignItems:"center",
                justifyContent:"center", gap:8
              }}>
                + New profile
              </button>
            </div>
          )}

          {/* CREATE MODE */}
          {mode === "create" && (
            <div>
              {/* Preview avatar */}
              <div style={{display:"flex",justifyContent:"center",marginBottom:20}}>
                <div style={{
                  width:64, height:64, borderRadius:"50%", background:color,
                  display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:24, fontWeight:700, color:"#fff", transition:"background 0.2s"
                }}>
                  {initials || "?"}
                </div>
              </div>

              {/* Name input */}
              <label style={{display:"block",marginBottom:14}}>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:6}}>Your name or initials</span>
                <input
                  autoFocus
                  value={name}
                  onChange={e => setName(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter") handleCreate(); }}
                  placeholder="e.g. SG or Shawn G."
                  style={{
                    width:"100%", fontSize:14, padding:"10px 12px",
                    border:"0.5px solid var(--color-border-secondary)", borderRadius:8,
                    background:"var(--color-background-secondary)", color:"var(--color-text-primary)", outline:"none"
                  }}
                />
              </label>

              {/* Color picker */}
              <div style={{marginBottom:20}}>
                <span style={{fontSize:12,color:"var(--color-text-secondary)",display:"block",marginBottom:8}}>Profile color</span>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {PROFILE_COLORS.map(c => (
                    <button key={c} onClick={() => setColor(c)} style={{
                      width:30,height:30,borderRadius:"50%",background:c,border:color===c?"3px solid var(--color-text-primary)":"2px solid transparent",
                      cursor:"pointer",transition:"border 0.15s",padding:0
                    }} />
                  ))}
                </div>
              </div>

              {/* Buttons */}
              <div style={{display:"flex",gap:8}}>
                {profiles.length > 0 && (
                  <button onClick={() => setMode("pick")} style={{
                    flex:1, padding:"10px", border:"0.5px solid var(--color-border-secondary)",
                    borderRadius:8, background:"var(--color-background-secondary)", cursor:"pointer",
                    fontSize:13, color:"var(--color-text-secondary)"
                  }}>← Back</button>
                )}
                <button onClick={handleCreate} disabled={!name.trim() || creating} style={{
                  flex:2, padding:"10px", border:"none", borderRadius:8,
                  background:name.trim()?"var(--color-background-info)":"var(--color-background-secondary)",
                  color:name.trim()?"var(--color-text-info)":"var(--color-text-tertiary)",
                  cursor:name.trim()?"pointer":"default", fontSize:13, fontWeight:500,
                  opacity:creating?0.7:1, transition:"all 0.2s"
                }}>
                  {creating ? "Creating…" : "Create profile →"}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
