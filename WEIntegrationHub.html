<script>/**
 * storage.js — Drop-in replacement for Claude artifact's window.storage API.
 *
 * The app uses window.storage.get/set/delete everywhere.
 * This file makes those same calls work against the browser's localStorage,
 * so all app code runs identically with zero changes.
 *
 * HOW IT HANDLES shared vs personal:
 *   shared=true  → key stored as-is  (same data for everyone on this machine)
 *   shared=false → key stored with "__personal__" prefix (per browser profile)
 *
 * On Windows, each user has their own browser profile, so localStorage is
 * already siloed per user. shared=true vs false is a no-op in practice,
 * but the prefix is kept for forward-compatibility.
 */

const storage = {
  async get(key, shared = false) {
    try {
      const storeKey = shared ? key : `__personal__${key}`;
      const val = localStorage.getItem(storeKey);
      return val !== null ? { key, value: val, shared } : null;
    } catch (e) {
      console.warn('[storage] get error:', e);
      return null;
    }
  },

  async set(key, value, shared = false) {
    try {
      const storeKey = shared ? key : `__personal__${key}`;
      localStorage.setItem(storeKey, value);
      return { key, value, shared };
    } catch (e) {
      console.warn('[storage] set error:', e);
      return null;
    }
  },

  async delete(key, shared = false) {
    try {
      const storeKey = shared ? key : `__personal__${key}`;
      localStorage.removeItem(storeKey);
      return { key, deleted: true, shared };
    } catch (e) {
      console.warn('[storage] delete error:', e);
      return null;
    }
  },

  async list(prefix = '', shared = false) {
    try {
      const keys = Object.keys(localStorage)
        .filter(k => shared
          ? k.startsWith(prefix) && !k.startsWith('__personal__')
          : k.startsWith(`__personal__${prefix}`)
        )
        .map(k => shared ? k : k.replace('__personal__', ''));
      return { keys, prefix, shared };
    } catch (e) {
      return null;
    }
  }
};

// Polyfill — makes window.storage work exactly like the Claude artifact API
if (typeof window !== 'undefined') {
  window.storage = storage;
}

// ─── Helpers ───────────────────────────────────────────────────────────────────
function genId()   { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function daysTo(d) { return d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null; }
function pct(list) { return !list?.length ? 0 : Math.round(list.filter(i=>i.done).length/list.length*100); }
function getChecklistTemplate(type, projectType) {
  if (type === "General" && projectType === "Vendor Conversion") return VC_GENERAL.map(i=>({...i,done:false,starred:false}));
  if (type === "Results") return CHECKLISTS_RESULTS.map(i=>({...i,done:false,starred:false}));
  return (CHECKLISTS[type]||[]).map(i=>({...i,done:false,starred:false}));
}
function getAlerts(project, threshold=14) {
  const days = daysTo(project.goLiveDate);
  if (!days || days > threshold || days <= 0) return [];
  return (project.interfaces||[]).flatMap(type => {
    const pending = (project.checklists?.[type]||[]).filter(i=>!i.done).length;
    return pending > 0 ? [`${type}: ${pending} pending (${days}d)`] : [];
  });
}

// ─── Settings Hook ─────────────────────────────────────────────────────────────
function useSettings() {
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get("wce_settings_v1",false); if(r?.value) setSettings({...DEFAULT_SETTINGS,...JSON.parse(r.value)}); } catch {}
      setLoaded(true);
    })();
  }, []);
  const save = useCallback(async (updated) => {
    const next = {...settings,...updated};
    setSettings(next);
    try { await window.storage.set("wce_settings_v1",JSON.stringify(next),false); } catch {}
  }, [settings]);
  return [settings, save, loaded];
}

// ─── Theme Injector ────────────────────────────────────────────────────────────
function useTheme(theme) {
  useEffect(() => {
    const id = "wce-theme-style";
    let el = document.getElementById(id);
    if (!el) { el = document.createElement("style"); el.id = id; document.head.appendChild(el); }
    el.textContent = THEME_CSS[theme] || "";
    return () => { if(el) el.textContent = ""; };
  }, [theme]);
}


// ─── Export Utilities ──────────────────────────────────────────────────────────
function downloadBlob(text, filename, mime) {
  const blob = new Blob([text], { type: mime });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function buildTxt(project) {
  const sep  = '='.repeat(60);
  const dash = '-'.repeat(40);
  const lines = [];
  const add  = (...args) => lines.push(...args);
  const yn   = v => v ? String(v) : '—';

  add(sep, `PROJECT: ${project.name || '—'}`, sep, '');

  // ── Header metadata ─────────────────────────────────────────────
  add('PROJECT DETAILS', dash);
  add(`PR Number:          ${yn(project.projectNumber)}`);
  add(`Project Type:       ${yn(project.projectType)}`);
  add(`Status:             ${yn(project.status)}`);
  add(`Assignee:           ${yn(project.assignee)}`);
  add(`Go-live Date:       ${yn(project.goLiveDate)}`);
  add(`Account / Facility: ${yn(project.account)}`);
  add(`Assigned when/how:  ${yn(project.assignedHow)}`);
  add('');
  add('SETUP INFORMATION', dash);
  add(`Hospital Software:  ${yn(project.hospitalSoftware)}`);
  add(`Time Zone:          ${yn(project.timeZone)}`);
  add(`Connectivity:       ${yn(project.connectivity)}`);
  add(`Management Co.:     ${yn(project.managementCompany)}`);
  add(`Implementations:    ${yn(project.implementations)}`);
  add(`Facility ID TEST:   ${yn(project.facilityIdTest)}`);
  add(`Facility ID PROD:   ${yn(project.facilityIdProd)}`);
  add('');

  // ── Ports ───────────────────────────────────────────────────────
  const ports = project.ports || {};
  const ifaceRows = (project.interfaces || []).filter(t => t !== 'General');
  if (ifaceRows.length) {
    add('PORTS', dash);
    const colW = 18;
    const pad = (s, w) => String(s || '—').padEnd(w);
    add(`${pad('Interface',12)} ${pad('Test',colW)} ${pad('Test-Relay',colW)} ${pad('Prod',colW)} ${pad('Prod-Relay',colW)}`);
    ifaceRows.forEach(iface => {
      const p = ports[iface] || {};
      add(`${pad(iface,12)} ${pad(p.test,colW)} ${pad(p.testRelay,colW)} ${pad(p.prod,colW)} ${pad(p.prodRelay,colW)}`);
    });
    add('');
  }

  // ── Contacts ────────────────────────────────────────────────────
  const contacts = project.contacts || [];
  if (contacts.length) {
    add('CONTACTS', dash);
    contacts.forEach(c => {
      add(`  ${c.name || '—'} (${c.role || 'No role'})`);
      if (c.email) add(`    Email:  ${c.email}`);
      if (c.phone) add(`    Phone:  ${c.phone}`);
    });
    add('');
  }

  // ── Checklists ──────────────────────────────────────────────────
  const ALL_ORDER = ['General','ADT','Billing','ClinDoc','SIU','Results'];
  const ifaces = ALL_ORDER.filter(t => (project.interfaces || []).includes(t));
  if (ifaces.length) {
    add('CHECKLISTS', dash);
    ifaces.forEach(type => {
      const cl = project.checklists?.[type] || [];
      const done = cl.filter(i => i.done).length;
      add(`\n  ${type.toUpperCase()} — ${done}/${cl.length} complete`);
      const phases = [...new Set(cl.map(i => i.phase))];
      phases.forEach(phase => {
        add(`  [ ${phase} ]`);
        cl.filter(i => i.phase === phase).forEach(item => {
          add(`    ${item.done ? '[x]' : '[ ]'} ${item.label}`);
        });
      });
    });
    add('');
  }

  // ── Custom To-dos ───────────────────────────────────────────────
  const todos = project.todos || [];
  if (todos.length) {
    add('TO-DO LIST', dash);
    todos.forEach(t => add(`  ${t.done ? '[x]' : '[ ]'} ${t.text}`));
    add('');
  }

  // ── Notes ───────────────────────────────────────────────────────
  const notes = [...(project.notes || [])].reverse();
  if (notes.length) {
    add('PROJECT NOTES', dash);
    notes.forEach(n => {
      const date = new Date(n.date).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
      add(`\n  [${n.author || '?'}] ${date}`);
      add(`  ${n.text.replace(/\n/g, '\n  ')}`);
      if ((n.docs || []).length) add(`  Documents: ${n.docs.join(', ')}`);
    });
    add('');
  }

  add(sep);
  add(`Exported from WE Integration Hub — ${new Date().toLocaleString()}`);
  return lines.join('\n');
}

  const safe = (project.name||'project').replace(/[^a-z0-9]/gi,'_').slice(0,40);
  downloadBlob(buildTxt(project), `${safe}_export.txt`, 'text/plain;charset=utf-8');
}

// ─── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [projects,      setProjects]      = useState([]);
  const [profiles,      setProfiles]      = useState([]);
  const [activeProfile, setActiveProfile] = useState(null); // current user's profile
  const [viewingId,     setViewingId]     = useState(null); // whose projects to show (null = mine)
  const [dataLoaded,    setDataLoaded]    = useState(false);
  const [view,          setView]          = useState("dashboard");
  const [selectedId,    setSelectedId]    = useState(null);
  const [settings,      saveSettings,     settingsLoaded] = useSettings();
  const [showSettings,  setShowSettings]  = useState(false);
  const [printProject,  setPrintProject]  = useState(null);

  useTheme(settings.theme);

  // ── Load profiles + projects + active profile from storage ─────────────────
  useEffect(() => {
    (async () => {
      try {
        const [pR, prR, apR] = await Promise.allSettled([
          window.storage.get("wce_v4",          true),   // projects (shared)
          window.storage.get("wce_profiles_v1",  true),   // profiles (shared)
          window.storage.get("wce_active_profile", false), // my profile id (personal)
        ]);
        const loadedProjects = pR.status==="fulfilled"&&pR.value?.value ? JSON.parse(pR.value.value) : [];
        const loadedProfiles = prR.status==="fulfilled"&&prR.value?.value ? JSON.parse(prR.value.value) : [];
        const savedActiveId  = apR.status==="fulfilled"&&apR.value?.value ? apR.value.value : null;
        setProjects(loadedProjects);
        setProfiles(loadedProfiles);
        if (savedActiveId) {
          const found = loadedProfiles.find(p=>p.id===savedActiveId);
          if (found) setActiveProfile(found);
        }
      } catch(e) { console.error("Load error", e); }
      setDataLoaded(true);
    })();
  }, []);

  // ── Persist helpers ─────────────────────────────────────────────────────────
  async function persistProjects(updated) {
    setProjects(updated);
    try { await window.storage.set("wce_v4", JSON.stringify(updated), true); } catch {}
  }
  async function persistProfiles(updated) {
    setProfiles(updated);
    try { await window.storage.set("wce_profiles_v1", JSON.stringify(updated), true); } catch {}
  }

  // ── Profile management ──────────────────────────────────────────────────────
  async function createProfile(name, color) {
    const profile = { id: genId(), name, color, createdAt: new Date().toISOString() };
    const updated = [...profiles, profile];
    await persistProfiles(updated);
    // Claim unclaimed projects
    const claimed = projects.map(p => (!p.profileId ? {...p, profileId: profile.id} : p));
    await persistProjects(claimed);
    // Save active profile to personal storage
    try { await window.storage.set("wce_active_profile", profile.id, false); } catch {}
    setActiveProfile(profile);
    setViewingId(null); // view my own projects
  }
  async function selectProfile(profile) {
    try { await window.storage.set("wce_active_profile", profile.id, false); } catch {}
    setActiveProfile(profile);
    setViewingId(null);
  }

  // ── Stamp helper — marks who last edited a project ─────────────────────────
  function stamp(project) {
    return activeProfile
      ? {...project, lastEditedBy: activeProfile.id, lastEditedAt: new Date().toISOString()}
      : project;
  }

  // ── Project mutations ───────────────────────────────────────────────────────
  function saveProject(data) {
    const existing = projects.find(p=>p.id===data.id);
    const allIfaces = ["General",...(data.interfaces||[])];
    const typeChanged = existing && existing.projectType !== data.projectType;
    const checklists = {};
    allIfaces.forEach(t => {
      const shouldRegen = !existing || (t==="General" && typeChanged);
      checklists[t] = (!shouldRegen && existing?.checklists?.[t]) || getChecklistTemplate(t, data.projectType);
    });
    if (existing) {
      persistProjects(projects.map(p => p.id===data.id ? stamp({...existing,...data,interfaces:allIfaces,checklists}) : p));
    } else {
      const newProj = stamp({...data, id:genId(), interfaces:allIfaces, checklists, notes:[], todos:[],
        profileId: activeProfile?.id || null, currentPhase: 0, createdAt: new Date().toISOString()});
      persistProjects([...projects, newProj]);
    }
    setView("dashboard");
  }
  function toggleItem(pid,type,iid) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,checklists:{...p.checklists,[type]:p.checklists[type].map(i=>i.id===iid?{...i,done:!i.done}:i)}})));
  }
  function addNote(pid,text,docs) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,notes:[...(p.notes||[]),{id:genId(),author:activeProfile?.name||"?",date:new Date().toISOString(),text,docs}]})));
  }
  function addTodo(pid,text)   { persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,todos:[...(p.todos||[]),{id:genId(),text,done:false,createdAt:new Date().toISOString()}]}))); }
  function toggleTodo(pid,tid) { persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,todos:(p.todos||[]).map(t=>t.id===tid?{...t,done:!t.done}:t)}))); }
  function deleteTodo(pid,tid) { persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,todos:(p.todos||[]).filter(t=>t.id!==tid)}))); }
  function deleteProject(id)   { persistProjects(projects.filter(p=>p.id!==id)); setView("dashboard"); }
  function updateProjectMeta(id,fields) { persistProjects(projects.map(p=>p.id!==id?p:stamp({...p,...fields}))); }
  function checkPhase(pid,type,ids,val) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,checklists:{...p.checklists,[type]:p.checklists[type].map(i=>ids.includes(i.id)?{...i,done:val}:i)}})));
  }
  function checkTab(pid,type,val) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,checklists:{...p.checklists,[type]:p.checklists[type].map(i=>({...i,done:val}))}})));
  }
  function starItem(pid,type,iid) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,checklists:{...p.checklists,[type]:p.checklists[type].map(i=>i.id===iid?{...i,starred:!i.starred}:i)}})));
  }
  function updatePhase(pid,phase) {
    persistProjects(projects.map(p=>p.id!==pid?p:stamp({...p,currentPhase:phase})));
  }
  function duplicateProject(proj) {
    const copy = stamp({
      ...proj, id:genId(), name:`${proj.name} (Copy)`, projectNumber:"", status:"Work in Progress",
      goLiveDate:"", facilityIdTest:"", facilityIdProd:"", ports:{}, notes:[], todos:[],
      profileId: activeProfile?.id || proj.profileId,
      createdAt: new Date().toISOString(),
      checklists: Object.fromEntries(Object.entries(proj.checklists||{}).map(([t,items])=>[t,items.map(i=>({...i,done:false}))])),
    });
    persistProjects([...projects, copy]);
    setSelectedId(copy.id);
    setView("detail");
  }

  const selected = projects.find(p=>p.id===selectedId);

  // ── Determine which profile is being viewed ─────────────────────────────────
  const viewingProfile = viewingId ? profiles.find(p=>p.id===viewingId) : activeProfile;

  // ── Filter projects for dashboard ───────────────────────────────────────────
  const dashProjects = viewingProfile
    ? projects.filter(p => p.profileId === viewingProfile.id || (!p.profileId && viewingProfile.id === activeProfile?.id))
    : projects; // fallback: show all if somehow no profile

  // ── Loading screen ──────────────────────────────────────────────────────────
  if (!dataLoaded || !settingsLoaded) return <div style={{padding:"3rem",textAlign:"center",color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",fontSize:13}}>Loading…</div>;

  // ── Profile picker (full-screen, first visit) ───────────────────────────────
  if (!activeProfile) return (
    <div id="wce-root" style={{fontFamily:"var(--font-sans)",minHeight:"100vh",background:"var(--color-background-primary)",color:"var(--color-text-primary)"}}>
      <ProfileSelect profiles={profiles} onCreate={createProfile} onSelect={selectProfile} />
    </div>
  );

  return (
    <div id="wce-root" style={{fontFamily:"var(--font-sans)",minHeight:"100vh",background:"var(--color-background-primary)",color:"var(--color-text-primary)",transition:"background 0.2s,color 0.2s"}}>
      <TopBar
        onNew={()=>{setSelectedId(null);setView("addEdit");}}
        onHome={()=>{setView("dashboard");setViewingId(null);}}
        onDocs={()=>setView("docs")}
        view={view}
        projectName={selected?.name}
        projectType={selected?.projectType}
        onSettings={()=>setShowSettings(true)}
        activeProfile={activeProfile}
        profiles={profiles}
        viewingProfile={viewingProfile}
        onSwitchProfile={p=>{setViewingId(p.id===activeProfile.id?null:p.id);setView("dashboard");}}
        onManageProfiles={()=>setActiveProfile(null)}
      />
      {view==="dashboard" && (
        <Dashboard
          projects={dashProjects}
          allProjects={projects}
          profiles={profiles}
          activeProfile={activeProfile}
          viewingProfile={viewingProfile}
          settings={settings}
          onSelect={id=>{setSelectedId(id);setView("detail");}}
          onEdit={id=>{setSelectedId(id);setView("addEdit");}}
          onSwitchView={p=>{setViewingId(p?p.id===activeProfile.id?null:p.id:null);}}
        />
      )}
      {view==="detail" && selected && (
        <DetailView
          project={selected}
          engineer={activeProfile?.name||"?"}
          setEngineer={()=>{}}
          settings={settings}
          profiles={profiles}
          activeProfile={activeProfile}
          onToggle={toggleItem}
          onAddNote={addNote}
          onAddTodo={addTodo}
          onToggleTodo={toggleTodo}
          onDeleteTodo={deleteTodo}
          onUpdate={updateProjectMeta}
          onCheckPhase={checkPhase}
          onCheckTab={checkTab}
          onStarItem={starItem}
          onUpdatePhase={updatePhase}
          onDuplicate={()=>duplicateProject(selected)}
          onSetPrintProject={setPrintProject}
          onEdit={()=>setView("addEdit")}
          onDelete={()=>deleteProject(selected.id)}
          onBack={()=>setView("dashboard")}
        />
      )}
      {view==="addEdit" && <EditForm project={view==="addEdit"&&selectedId?selected:null} settings={settings} activeProfile={activeProfile} onSave={saveProject} onCancel={()=>setView(selectedId&&selected?"detail":"dashboard")} />}
      {view==="docs" && <DocsPage onBack={()=>setView("dashboard")} activeProfile={activeProfile} />}
      {showSettings && <SettingsModal settings={settings} onSave={saveSettings} onClose={()=>setShowSettings(false)} />}
      {printProject && <PrintPreviewModal project={printProject} onClose={()=>setPrintProject(null)} />}
    </div>
  );
}

                <option value="Other">Other…</option>
              </select>
              {isOther && <input value={local.defaultEngineer} onChange={e=>S("defaultEngineer",e.target.value)} placeholder="Initials" style={{width:80,padding:"7px 10px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",fontSize:12,fontFamily:"var(--font-mono)",outline:"none"}} />}
            </div>
          </div>

          {/* Alert threshold */}
          <div>
            <div style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>
              Go-live alert threshold <span style={{color:"var(--color-text-tertiary)",fontWeight:400,textTransform:"none"}}>({local.alertThreshold} days)</span>
            </div>
            <div style={{display:"flex",gap:8}}>
              {[7,14,21,30].map(n=>{
                const sel = local.alertThreshold===n;
                return <button key={n} onClick={()=>S("alertThreshold",n)} style={{flex:1,padding:"7px",borderRadius:"var(--border-radius-md)",border:sel?"2px solid var(--color-border-info)":"0.5px solid var(--color-border-secondary)",background:sel?"var(--color-background-info)":"var(--color-background-secondary)",color:sel?"var(--color-text-info)":"var(--color-text-secondary)",fontSize:12,cursor:"pointer",fontWeight:sel?500:400,fontFamily:"var(--font-mono)"}}>{n}d</button>;
              })}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{padding:"16px 20px",borderTop:"0.5px solid var(--color-border-tertiary)",display:"flex",gap:10,flexShrink:0}}>
          <button onClick={onClose} style={{flex:1,padding:"9px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",fontSize:13,cursor:"pointer"}}>Cancel</button>
          <button onClick={apply} style={{flex:2,padding:"9px",border:"none",borderRadius:"var(--border-radius-md)",background:"var(--color-background-info)",color:"var(--color-text-info)",fontSize:13,cursor:"pointer",fontWeight:500}}>Save settings ↗</button>
        </div>
      </div>
    </div>
  );
}

// ─── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({projects,allProjects,profiles,activeProfile,viewingProfile,settings,onSelect,onEdit,onSwitchView}) {
  const [search,     setSearch]     = useState("");
  const [filterEng,  setFilterEng]  = useState("All");
  const [filterIface,setFilterIface]= useState("All");
  const [viewMode,   setViewMode]   = useState(settings.defaultView||"grid");
  const { density, alertThreshold } = settings;

  const allAlerts = projects.flatMap(p=>getAlerts(p,alertThreshold).map(a=>({project:p,msg:a})));

  const filtered = projects.filter(p=>{
    const q = search.toLowerCase();
    const matchSearch = !q || p.name?.toLowerCase().includes(q) || p.projectNumber?.toLowerCase().includes(q) || p.account?.toLowerCase().includes(q);
    const matchEng    = filterEng==="All" || p.assignee===filterEng;
    const matchIface  = filterIface==="All" || (p.interfaces||[]).includes(filterIface);
    return matchSearch && matchEng && matchIface;
  });

  const groups = [
    {status:"Work in Progress",items:filtered.filter(p=>p.status==="Work in Progress")},
    {status:"On Hold",         items:filtered.filter(p=>p.status==="On Hold")},
    {status:"Live",            items:filtered.filter(p=>p.status==="Live")},
  ].filter(g=>g.items.length);

  const chipBase = {fontSize:11,padding:"4px 10px",borderRadius:20,border:"0.5px solid var(--color-border-secondary)",cursor:"pointer",fontFamily:"var(--font-mono)",fontWeight:400,background:"transparent",color:"var(--color-text-secondary)",transition:"all 0.12s"};
  const chipActive = {background:"var(--color-background-info)",color:"var(--color-text-info)",border:"0.5px solid var(--color-border-info)",fontWeight:500};

  return (
    <div style={{padding:"20px"}}>
      {/* Profile strip */}
      {profiles&&profiles.length>1 && (
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
          {profiles.map(p=>{
            const isActive=(viewingProfile||activeProfile)?.id===p.id;
            const initials=p.name.trim().split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
            return (
              <button key={p.id} onClick={()=>onSwitchView(p)} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 12px 5px 6px",borderRadius:30,border:isActive?"1.5px solid "+p.color:"0.5px solid var(--color-border-secondary)",background:isActive?p.color+"18":"transparent",cursor:"pointer"}}>
                <div style={{width:20,height:20,borderRadius:"50%",background:p.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#fff",flexShrink:0}}>{initials}</div>
                <span style={{fontSize:12,fontWeight:isActive?500:400,color:isActive?"var(--color-text-primary)":"var(--color-text-secondary)"}}>{p.name}{p.id===activeProfile?.id?" (me)":""}</span>
                {isActive&&<span style={{fontSize:10,color:p.color}}>✓</span>}
              </button>
            );
          })}
          {viewingProfile&&activeProfile&&viewingProfile.id!==activeProfile.id&&(
            <button onClick={()=>onSwitchView(activeProfile)} style={{fontSize:11,padding:"4px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:20,background:"transparent",color:"var(--color-text-secondary)",cursor:"pointer"}}>← Mine</button>
          )}
        </div>
      )}
      {/* Viewing other person's projects banner */}
      {viewingProfile&&activeProfile&&viewingProfile.id!==activeProfile.id&&(
        <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--color-background-warning)",border:"0.5px solid var(--color-border-warning)",borderRadius:"var(--border-radius-md)",padding:"8px 12px",marginBottom:14}}>
          <div style={{width:18,height:18,borderRadius:"50%",background:viewingProfile.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,color:"#fff",flexShrink:0}}>
            {viewingProfile.name.trim().split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
          </div>
          <span style={{fontSize:12,color:"var(--color-text-warning)"}}>Viewing <strong>{viewingProfile.name}</strong>&apos;s projects</span>
        </div>
      )}
      {/* Stat cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))",gap:10,marginBottom:16}}>
        {[
          {icon:"ti-folders",       label:"Total",       val:projects.length,                                                  color:"var(--color-text-primary)"},
          {icon:"ti-loader-2",      label:"In progress", val:projects.filter(p=>p.status==="Work in Progress").length,         color:"var(--color-text-info)"},
          {icon:"ti-circle-check",  label:"Live",        val:projects.filter(p=>p.status==="Live").length,                    color:"var(--color-text-success)"},
          {icon:"ti-alert-triangle",label:"Alerts",      val:allAlerts.length,color:allAlerts.length?"var(--color-text-danger)":"var(--color-text-tertiary)"},
        ].map(s=>(
          <div key={s.label} style={{background:"var(--color-background-secondary)",borderRadius:"var(--border-radius-md)",padding:density==="compact"?"10px 12px":"12px 14px",border:"0.5px solid var(--color-border-tertiary)"}}>
            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:5}}>
              <i className={`ti ${s.icon}`} style={{fontSize:12,color:"var(--color-text-tertiary)"}} />
              <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>{s.label}</span>
            </div>
            <div style={{fontSize:20,fontWeight:500,color:s.color,lineHeight:1}}>{s.val}</div>
          </div>
        ))}
      </div>

      {/* Alerts banner */}
      {allAlerts.length>0 && (
        <div style={{background:"var(--color-background-danger)",border:"0.5px solid var(--color-border-danger)",borderRadius:"var(--border-radius-lg)",padding:"10px 14px",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
            <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>⚠️</span>
            <span style={{fontSize:11,fontWeight:500,color:"var(--color-text-danger)"}}>Go-live within {alertThreshold} days — pending checklist items</span>
          </div>
          {allAlerts.map((a,i)=>(
            <div key={i} onClick={()=>onSelect(a.project.id)} style={{display:"flex",gap:8,fontSize:11,padding:"2px 0",cursor:"pointer"}}>
              <span style={{color:"var(--color-text-secondary)"}}>{a.project.name}</span>
              <span style={{color:"var(--color-text-tertiary)"}}>→</span>
              <span style={{color:"var(--color-text-danger)"}}>{a.msg}</span>
            </div>
          ))}
        </div>
      )}

      {/* Search + filter + view toggle */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:180,display:"flex",alignItems:"center",gap:8,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",padding:"7px 10px"}}>
          <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, PR #, or account…" style={{background:"transparent",border:"none",outline:"none",fontSize:12,color:"var(--color-text-primary)",width:"100%"}} />
          {search && <button onClick={()=>setSearch("")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",padding:0,fontSize:12}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✕</span></button>}
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {/* Engineer filter */}
          <select value={filterEng} onChange={e=>setFilterEng(e.target.value)} style={{fontSize:11,padding:"6px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",cursor:"pointer",fontFamily:"var(--font-mono)"}}>
            <option value="All">All engineers</option>
            {ENGINEERS.map(e=><option key={e}>{e}</option>)}
          </select>
          {/* Interface filter chips */}
          <div style={{display:"flex",gap:4}}>
            {["All",...SELECTABLE_INTERFACES].map(f=>{
              const sel = filterIface===f;
              const c = sel&&f!=="All" ? INTERFACE_COLORS[f] : null;
              return <button key={f} onClick={()=>setFilterIface(f)} style={{...chipBase,...(sel?c?{background:c.bg,color:c.text,border:`0.5px solid ${c.border}`,fontWeight:500}:chipActive:{})}}>{f}</button>;
            })}
          </div>
          {/* Grid/List toggle */}
          <div style={{display:"flex",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",overflow:"hidden"}}>
            {[{id:"grid",icon:"ti-layout-grid"},{id:"list",icon:"ti-layout-rows"}].map(v=>(
              <button key={v.id} onClick={()=>setViewMode(v.id)} style={{padding:"6px 10px",border:"none",background:viewMode===v.id?"var(--color-background-info)":"var(--color-background-secondary)",color:viewMode===v.id?"var(--color-text-info)":"var(--color-text-tertiary)",cursor:"pointer",fontSize:14}}>
                <i className={`ti ${v.icon}`} />
              </button>
            ))}
          </div>
        </div>
      </div>

      {/* Results info */}
      {(search||filterEng!=="All"||filterIface!=="All") && (
        <div style={{fontSize:11,color:"var(--color-text-tertiary)",marginBottom:12,fontFamily:"var(--font-mono)"}}>
          Showing {filtered.length} of {projects.length} projects
          {(search||filterEng!=="All"||filterIface!=="All") && <button onClick={()=>{setSearch("");setFilterEng("All");setFilterIface("All");}} style={{marginLeft:8,background:"none",border:"none",color:"var(--color-text-info)",cursor:"pointer",fontSize:11}}>Clear filters</button>}
        </div>
      )}

      {!groups.length && (
        <div style={{textAlign:"center",padding:"60px 20px",color:"var(--color-text-tertiary)"}}>
          <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>🔗</span>
          <div style={{fontSize:13,color:"var(--color-text-secondary)",fontWeight:500,marginBottom:4}}>{projects.length===0?"No projects yet":"No projects match your filters"}</div>
          <div style={{fontSize:11}}>{projects.length===0?'Click "New project" to get started':"Try adjusting your search or filters"}</div>
        </div>
      )}

      {groups.map(g=>(
        <div key={g.status} style={{marginBottom:24}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:STATUS_META[g.status]?.dot}} />
            <span style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{g.status} ({g.items.length})</span>
          </div>
          {viewMode==="grid"
            ? <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:10}}>{g.items.map(p=><ProjectCard key={p.id} project={p} density={density} alertThreshold={alertThreshold} profiles={profiles} activeProfile={activeProfile} onSelect={()=>onSelect(p.id)} onEdit={()=>onEdit(p.id)} />)}</div>
            : <div style={{display:"flex",flexDirection:"column",gap:4}}>{g.items.map(p=><ProjectRow key={p.id} project={p} density={density} alertThreshold={alertThreshold} profiles={profiles} activeProfile={activeProfile} onSelect={()=>onSelect(p.id)} onEdit={()=>onEdit(p.id)} />)}</div>
          }
        </div>
      ))}
    </div>
  );
}

// ─── ProjectCard (grid view) ───────────────────────────────────────────────────
function ProjectCard({project,density,alertThreshold,profiles,activeProfile,onSelect,onEdit}) {
  const days    = daysTo(project.goLiveDate);
  const alerts  = getAlerts(project,alertThreshold);
  const sm      = STATUS_META[project.status]||STATUS_META["Work in Progress"];
  const allItems= Object.values(project.checklists||{}).flat();
  const progress= pct(allItems);
  const compact = density==="compact";
  const todosPending=(project.todos||[]).filter(t=>!t.done).length;

  return (
    <div onClick={onSelect} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:compact?"10px 12px":"14px",cursor:"pointer",position:"relative",transition:"border-color 0.15s"}}>
      {alerts.length>0 && <div style={{position:"absolute",top:9,right:9,width:7,height:7,borderRadius:"50%",background:"var(--color-background-danger)",border:"1.5px solid var(--color-border-danger)"}} />}
      {project.projectNumber && <div style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",marginBottom:2}}>{project.projectNumber}</div>}
      <div style={{fontSize:compact?12:13,fontWeight:500,color:"var(--color-text-primary)",lineHeight:1.4,marginBottom:compact?6:8,paddingRight:16}}>{project.name}</div>
      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:compact?6:8,flexWrap:"wrap"}}>
        <span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:sm.bg,color:sm.text,fontWeight:500}}>{project.status}</span>
        {project.projectType==="Vendor Conversion"&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:20,background:"var(--color-background-warning)",color:"var(--color-text-warning)",fontFamily:"var(--font-mono)"}}>VC</span>}
        {project.assignee&&<span style={{fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}>{project.assignee}</span>}
      </div>
      {!compact && <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}}>
        {(project.interfaces||[]).filter(t=>t!=="General").map(t=>{const c=INTERFACE_COLORS[t];return <span key={t} style={{fontSize:10,padding:"2px 6px",borderRadius:4,background:c.bg,color:c.text,fontFamily:"var(--font-mono)"}}>{t} {pct(project.checklists?.[t])}%</span>;})}
      </div>}
      {allItems.length>0&&(
        <div style={{marginBottom:compact?6:8}}>
          {!compact&&<div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:10,color:"var(--color-text-tertiary)"}}>Overall</span><span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)"}}>{allItems.filter(i=>i.done).length}/{allItems.length}</span></div>}
          <div style={{height:3,background:"var(--color-background-tertiary)",borderRadius:2,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${progress}%`,background:progress===100?"var(--color-background-success)":"var(--color-background-info)",borderRadius:2}} />
          </div>
        </div>
      )}
      {(()=>{
        const editor = project.lastEditedBy && profiles ? profiles.find(p=>p.id===project.lastEditedBy) : null;
        const isOwnedByMe = project.profileId === activeProfile?.id;
        const editedByOther = editor && !isOwnedByMe && editor.id !== activeProfile?.id;
        const editedMine = editor && isOwnedByMe && editor.id !== activeProfile?.id;
        if ((editedByOther || editedMine) && editor) {
          return (
            <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:6}}>
              <div style={{width:12,height:12,borderRadius:"50%",background:editor.color,flexShrink:0}} />
              <span style={{fontSize:9,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)"}}>Edited by {editor.name}</span>
            </div>
          );
        }
        return null;
      })()}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        {days!==null?<div style={{fontSize:10,fontFamily:"var(--font-mono)",color:days<=0?"var(--color-text-success)":days<=7?"var(--color-text-danger)":days<=14?"var(--color-text-warning)":"var(--color-text-tertiary)"}}><span aria-hidden="true" style={{marginRight:3}}>{days<=0?"✅":"📅"}</span>{days<=0?"Go-live reached":`${days}d — ${new Date(project.goLiveDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`}</div>:<span />}
        {todosPending>0&&<span style={{fontSize:9,fontFamily:"var(--font-mono)",color:"var(--color-text-secondary)",padding:"1px 5px",borderRadius:8,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-tertiary)"}}>{todosPending} to-do</span>}
      </div>
      <button onClick={e=>{e.stopPropagation();onEdit();}} style={{position:"absolute",bottom:8,right:8,background:"none",border:"none",color:"var(--color-text-tertiary)",cursor:"pointer",padding:4,borderRadius:4,fontSize:12}} aria-label="Edit"><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✏️</span></button>
    </div>
  );
}

// ─── ProjectRow (list view) ────────────────────────────────────────────────────
function ProjectRow({project,density,alertThreshold,onSelect,onEdit}) {
  const days   = daysTo(project.goLiveDate);
  const alerts = getAlerts(project,alertThreshold);
  const sm     = STATUS_META[project.status]||STATUS_META["Work in Progress"];
  const allItems= Object.values(project.checklists||{}).flat();
  const progress= pct(allItems);
  const compact = density==="compact";

  return (
    <div onClick={onSelect} style={{display:"flex",alignItems:"center",gap:12,background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",padding:compact?"8px 14px":"10px 14px",cursor:"pointer",position:"relative"}}>
      {alerts.length>0&&<div style={{width:6,height:6,borderRadius:"50%",background:"var(--color-text-danger)",flexShrink:0}} />}
      {/* Name + PR */}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          {project.projectNumber&&<span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",flexShrink:0}}>{project.projectNumber}</span>}
          <span style={{fontSize:12,fontWeight:500,color:"var(--color-text-primary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{project.name}</span>
        </div>
      </div>
      {/* Status */}
      <span style={{fontSize:10,padding:"2px 7px",borderRadius:20,background:sm.bg,color:sm.text,fontWeight:500,flexShrink:0,display:compact?"none":"flex"}}>{project.status}</span>
      {/* Type badge */}
      {project.projectType==="Vendor Conversion"&&<span style={{fontSize:10,padding:"2px 6px",borderRadius:20,background:"var(--color-background-warning)",color:"var(--color-text-warning)",fontFamily:"var(--font-mono)",flexShrink:0}}>VC</span>}
      {/* Interface chips */}
      <div style={{display:"flex",gap:4,flexShrink:0}}>
        {(project.interfaces||[]).filter(t=>t!=="General").map(t=>{const c=INTERFACE_COLORS[t];return <span key={t} style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:c.bg,color:c.text,fontFamily:"var(--font-mono)"}}>{t}</span>;})}
      </div>
      {/* Progress */}
      <div style={{width:80,flexShrink:0}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
          <span style={{fontSize:9,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}>{allItems.filter(i=>i.done).length}/{allItems.length}</span>
          <span style={{fontSize:9,color:"var(--color-text-secondary)",fontFamily:"var(--font-mono)"}}>{progress}%</span>
        </div>
        <div style={{height:3,background:"var(--color-background-tertiary)",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${progress}%`,background:progress===100?"var(--color-background-success)":"var(--color-background-info)",borderRadius:2}} />
        </div>
      </div>
      {/* Go-live */}
      <div style={{fontSize:10,fontFamily:"var(--font-mono)",color:!days?"var(--color-text-tertiary)":days<=0?"var(--color-text-success)":days<=7?"var(--color-text-danger)":days<=14?"var(--color-text-warning)":"var(--color-text-tertiary)",flexShrink:0,width:90,textAlign:"right"}}>
        {days===null?"—":days<=0?"✓ Live":`${days}d · ${new Date(project.goLiveDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric"})}`}
      </div>
      {/* Assignee */}
      {project.assignee&&<span style={{fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",flexShrink:0,width:30,textAlign:"right"}}>{project.assignee}</span>}
      {/* Edit */}
      <button onClick={e=>{e.stopPropagation();onEdit();}} style={{background:"none",border:"none",color:"var(--color-text-tertiary)",cursor:"pointer",padding:4,borderRadius:4,fontSize:12,flexShrink:0}} aria-label="Edit"><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✏️</span></button>
    </div>
  );
}

// ─── DetailView ────────────────────────────────────────────────────────────────
function DetailView({project,engineer,setEngineer,settings,profiles,activeProfile,onToggle,onAddNote,onAddTodo,onToggleTodo,onDeleteTodo,onUpdate,onCheckPhase,onCheckTab,onStarItem,onUpdatePhase,onDuplicate,onSetPrintProject,onEdit,onDelete,onBack}) {
  const ordered = ALL_INTERFACE_ORDER.filter(t=>(project.interfaces||[]).includes(t));
  const [activeIface,setActiveIface]=useState(ordered[0]||"General");
  const [tab,setTab]=useState("checklist");
  const [confirmDel,setConfirmDel]=useState(false);
  const {density,alertThreshold}=settings;
  const compact=density==="compact";

  const checklist=project.checklists?.[activeIface]||[];
  const phases=[...new Set(checklist.map(i=>i.phase))];
  const ic=INTERFACE_COLORS[activeIface]||INTERFACE_COLORS.General;
  const alerts=getAlerts(project,alertThreshold);
  const days=daysTo(project.goLiveDate);
  const sm=STATUS_META[project.status]||STATUS_META["Work in Progress"];
  const todosTotal=(project.todos||[]).length;
  const todosPending=(project.todos||[]).filter(t=>!t.done).length;

  return (
    <div style={{padding:"20px"}}>
      {/* Header */}
      <div style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5}}>
              <button onClick={onBack} style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-secondary)",fontSize:12,display:"flex",alignItems:"center",gap:4,padding:0}}>
                <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>←</span> All projects
              </button>
              {project.projectNumber&&<><span style={{color:"var(--color-text-tertiary)",fontSize:12}}>·</span><span style={{fontSize:11,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)"}}>{project.projectNumber}</span></>}
            </div>
            <h2 style={{margin:"0 0 8px",fontSize:compact?15:17,fontWeight:500,color:"var(--color-text-primary)",lineHeight:1.3}}>{project.name}</h2>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:11,padding:"2px 9px",borderRadius:20,background:sm.bg,color:sm.text,fontWeight:500}}>{project.status}</span>
              {project.projectType==="Vendor Conversion"&&<span style={{fontSize:10,padding:"2px 8px",borderRadius:20,background:"var(--color-background-warning)",color:"var(--color-text-warning)",fontFamily:"var(--font-mono)",fontWeight:500}}>Vendor Conversion</span>}
              {project.assignee&&<span style={{fontSize:11,color:"var(--color-text-secondary)",fontFamily:"var(--font-mono)"}}>{project.assignee}</span>}
              {(()=>{
                const owner  = profiles&&project.profileId?profiles.find(p=>p.id===project.profileId):null;
                const editor = profiles&&project.lastEditedBy?profiles.find(p=>p.id===project.lastEditedBy):null;
                return (<>
                  {owner&&<span style={{fontSize:10,padding:"1px 7px",borderRadius:20,background:owner.color+"20",color:owner.color,fontFamily:"var(--font-mono)"}}>👤 {owner.name}</span>}
                  {editor&&editor.id!==activeProfile?.id&&<span style={{fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}>✏️ {editor.name}</span>}
                </>);
              })()}
              {days!==null&&<span style={{fontSize:11,fontFamily:"var(--font-mono)",color:days<=0?"var(--color-text-success)":days<=7?"var(--color-text-danger)":days<=14?"var(--color-text-warning)":"var(--color-text-tertiary)"}}>{days<=0?"✓ Go-live reached":`${days}d to go-live · ${new Date(project.goLiveDate+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`}</span>}
            </div>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
            <button onClick={onEdit} style={{display:"flex",alignItems:"center",gap:5,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",fontSize:12,cursor:"pointer",color:"var(--color-text-primary)"}}>
              <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✏️</span> Edit
            </button>
            <button onClick={()=>exportTxt(project)} title="Download as plain text" style={{display:"flex",alignItems:"center",gap:5,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>
              📄 .txt
            </button>
            <button onClick={()=>onSetPrintProject(project)} title="Print preview — save as PDF from the print dialog" style={{display:"flex",alignItems:"center",gap:5,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>
              🖨️ PDF
            </button>
            <button onClick={onDuplicate} title="Duplicate project — creates a copy with fresh checklists" style={{display:"flex",alignItems:"center",gap:5,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)"}}>
              📑 Duplicate
            </button>
            {!confirmDel
              ?<button onClick={()=>setConfirmDel(true)} style={{display:"flex",alignItems:"center",gap:5,padding:"6px 14px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-danger)",background:"var(--color-background-danger)",fontSize:12,cursor:"pointer",color:"var(--color-text-danger)"}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>🗑</span> Delete</button>
              :<div style={{display:"flex",gap:6,alignItems:"center"}}><span style={{fontSize:12,color:"var(--color-text-danger)"}}>Sure?</span><button onClick={onDelete} style={{padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"none",background:"var(--color-background-danger)",color:"var(--color-text-danger)",fontSize:12,cursor:"pointer",fontWeight:500}}>Yes</button><button onClick={()=>setConfirmDel(false)} style={{padding:"6px 12px",borderRadius:"var(--border-radius-md)",border:"0.5px solid var(--color-border-secondary)",background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",fontSize:12,cursor:"pointer"}}>No</button></div>}
          </div>
        </div>
      </div>

      {alerts.length>0&&(
        <div style={{background:"var(--color-background-danger)",border:"0.5px solid var(--color-border-danger)",borderRadius:"var(--border-radius-md)",padding:"10px 14px",marginBottom:16}}>
          <div style={{display:"flex",gap:5,alignItems:"center",marginBottom:4}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>⚠️</span><span style={{fontSize:11,fontWeight:500,color:"var(--color-text-danger)"}}>Go-live approaching — items still pending</span></div>
          {alerts.map((a,i)=><div key={i} style={{fontSize:11,color:"var(--color-text-danger)",paddingLeft:17}}>{a}</div>)}
        </div>
      )}

      {/* Tabs */}
      <div style={{borderBottom:"0.5px solid var(--color-border-tertiary)",display:"flex",gap:2,marginBottom:20,overflowX:"auto"}}>
        {/* Overview tab always first */}
        <button onClick={()=>{setTab("overview");setActiveIface(null);}} style={{padding:compact?"7px 12px":"9px 14px",border:"none",borderBottom:tab==="overview"?"2px solid var(--color-border-primary)":"2px solid transparent",background:"transparent",fontSize:compact?11:12,fontWeight:tab==="overview"?500:400,cursor:"pointer",color:tab==="overview"?"var(--color-text-primary)":"var(--color-text-secondary)",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,marginBottom:-1}}>
          📋 Overview
        </button>
        {ordered.map(t=>{
          const c=INTERFACE_COLORS[t];const p2=pct(project.checklists?.[t]);const active=activeIface===t&&tab==="checklist";
          return <button key={t} onClick={()=>{setActiveIface(t);setTab("checklist");}} style={{padding:compact?"7px 12px":"9px 14px",border:"none",borderBottom:active?`2px solid ${c.text}`:"2px solid transparent",background:"transparent",fontSize:compact?11:12,fontWeight:active?500:400,cursor:"pointer",color:active?c.text:"var(--color-text-secondary)",whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5,marginBottom:-1}}>
            {t==="General"&&<span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>🔌</span>}{t}
            <span style={{fontSize:9,fontFamily:"var(--font-mono)",padding:"1px 5px",borderRadius:8,background:p2===100?"var(--color-background-success)":c.bg,color:p2===100?"var(--color-text-success)":c.text}}>{p2}%</span>
          </button>;
        })}
        {(()=>{const starCount=Object.values(project.checklists||{}).flat().filter(i=>i.starred).length;return(<button onClick={()=>{setTab("starred");setActiveIface(null);}} style={{padding:compact?"7px 12px":"9px 14px",border:"none",borderBottom:tab==="starred"?"2px solid #f59e0b":"2px solid transparent",background:"transparent",fontSize:compact?11:12,cursor:"pointer",color:tab==="starred"?"#d97706":"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:4,marginBottom:-1,whiteSpace:"nowrap"}}>
          ⭐{starCount>0&&<span style={{fontSize:10,fontFamily:"var(--font-mono)",background:"#fef3c7",color:"#92400e",borderRadius:10,padding:"0 5px",lineHeight:"16px"}}>{starCount}</span>}
        </button>);})()}
        <button onClick={()=>{setTab("notes");setActiveIface(null);}} style={{padding:compact?"7px 12px":"9px 14px",border:"none",borderBottom:tab==="notes"?"2px solid var(--color-border-primary)":"2px solid transparent",background:"transparent",fontSize:compact?11:12,cursor:"pointer",color:tab==="notes"?"var(--color-text-primary)":"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:5,marginBottom:-1,whiteSpace:"nowrap"}}>
          <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>📝</span> Notes
          {(project.notes||[]).length>0&&<span style={{fontSize:9,fontFamily:"var(--font-mono)",padding:"1px 5px",borderRadius:8,background:"var(--color-background-secondary)",color:"var(--color-text-secondary)"}}>{project.notes.length}</span>}
        </button>
        <button onClick={()=>{setTab("todo");setActiveIface(null);}} style={{padding:compact?"7px 12px":"9px 14px",border:"none",borderBottom:tab==="todo"?"2px solid var(--color-border-primary)":"2px solid transparent",background:"transparent",fontSize:compact?11:12,cursor:"pointer",color:tab==="todo"?"var(--color-text-primary)":"var(--color-text-secondary)",display:"flex",alignItems:"center",gap:5,marginBottom:-1,whiteSpace:"nowrap"}}>
          <span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>☑</span> To-do
          {todosTotal>0&&<span style={{fontSize:9,fontFamily:"var(--font-mono)",padding:"1px 5px",borderRadius:8,background:todosPending>0?"var(--color-background-info)":"var(--color-background-success)",color:todosPending>0?"var(--color-text-info)":"var(--color-text-success)"}}>{todosPending}/{todosTotal}</span>}
        </button>
      </div>

      {/* Checklist */}
      {tab==="checklist"&&activeIface&&(
        <div>
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
              <span style={{fontSize:12,color:"var(--color-text-secondary)"}}>{checklist.filter(i=>i.done).length} of {checklist.length} complete</span>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:11,fontFamily:"var(--font-mono)",fontWeight:500,color:ic.text}}>{pct(checklist)}%</span>
                <button onClick={()=>onCheckTab(project.id,activeIface,pct(checklist)<100)} style={{fontSize:10,padding:"2px 9px",border:"0.5px solid var(--color-border-secondary)",borderRadius:20,background:"var(--color-background-secondary)",color:"var(--color-text-secondary)",cursor:"pointer",fontFamily:"var(--font-mono)",whiteSpace:"nowrap"}}>
                  {pct(checklist)===100?"Uncheck all":"✓ Check all"}
                </button>
              </div>
            </div>
            <div style={{height:4,background:"var(--color-background-tertiary)",borderRadius:2,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${pct(checklist)}%`,background:ic.text,borderRadius:2,transition:"width 0.3s"}} />
            </div>
          </div>
          {activeIface==="General"&&<div style={{background:"var(--color-background-info)",border:"0.5px solid var(--color-border-info)",borderRadius:"var(--border-radius-md)",padding:"8px 12px",marginBottom:14,fontSize:11,color:"var(--color-text-info)",display:"flex",alignItems:"flex-start",gap:6}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>ℹ️</span>{project.projectType==="Vendor Conversion"?"VC project: connectivity → MRN/recurring account assessment → cutover plan → go-live & closure.":"Connectivity must be complete before any interface prep begins. Go-Live & Closure wraps the project after all interfaces are built and tested."}</div>}
          {phases.map(phase=>{
            const items=checklist.filter(i=>i.phase===phase);
            const done=items.filter(i=>i.done).length;
            const allDone=done===items.length;
            const phaseIds=items.map(i=>i.id);
            return <div key={phase} style={{marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7}}>
                <div style={{display:"flex",alignItems:"center",gap:7}}>
                  <span style={{fontSize:11,color:allDone?"var(--color-text-success)":"var(--color-text-tertiary)",flexShrink:0}}>{allDone?"✅":"○"}</span>
                  <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:allDone?"var(--color-text-success)":"var(--color-text-secondary)",textTransform:"uppercase",letterSpacing:"0.06em"}}>{phase} · {done}/{items.length}</span>
                </div>
                <button onClick={()=>onCheckPhase(project.id,activeIface,phaseIds,!allDone)} style={{fontSize:10,padding:"1px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:20,background:"transparent",color:"var(--color-text-tertiary)",cursor:"pointer",fontFamily:"var(--font-mono)",whiteSpace:"nowrap"}}>
                  {allDone?"Uncheck":"✓ All"}
                </button>
              </div>
              <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",overflow:"hidden"}}>
                {items.map((item,idx)=>(
                  <div key={item.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:compact?"8px 12px":"11px 14px",borderBottom:idx<items.length-1?"0.5px solid var(--color-border-tertiary)":"none",background:item.starred?"#fffbeb":"transparent",transition:"background 0.1s"}}>
                    <div onClick={()=>onToggle(project.id,activeIface,item.id)} style={{width:15,height:15,borderRadius:3,flexShrink:0,marginTop:2,border:item.done?"none":"0.5px solid var(--color-border-primary)",background:item.done?ic.text:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                      {item.done&&<span aria-hidden="true" style={{display:"inline-block",lineHeight:1,fontSize:9,color:"var(--color-background-primary)"}}>✓</span>}
                    </div>
                    <div onClick={()=>onToggle(project.id,activeIface,item.id)} style={{flex:1,cursor:"pointer"}}>
                      <div style={{fontSize:compact?12:13,color:item.done?"var(--color-text-tertiary)":"var(--color-text-primary)",textDecoration:item.done?"line-through":"none",lineHeight:1.5}}>{item.label}</div>
                      {item.hint&&!item.done&&!compact&&<div style={{fontSize:11,color:"var(--color-text-tertiary)",marginTop:2,lineHeight:1.5}}>{item.hint}</div>}
                    </div>
                    <button onClick={e=>{e.stopPropagation();onStarItem(project.id,activeIface,item.id);}} title={item.starred?"Remove star":"Star this task"} style={{background:"none",border:"none",cursor:"pointer",fontSize:12,padding:"1px 3px",flexShrink:0,marginTop:1,opacity:item.starred?1:0.25,transition:"opacity 0.15s"}} onMouseEnter={e=>e.currentTarget.style.opacity="1"} onMouseLeave={e=>e.currentTarget.style.opacity=item.starred?"1":"0.25"}>
                      {item.starred?"⭐":"☆"}
                    </button>
                  </div>
                ))}
              </div>
            </div>;
          })}
        </div>
      )}

      {tab==="starred"&&(()=>{
        const allStarred = ALL_INTERFACE_ORDER
          .filter(t=>(project.interfaces||[]).includes(t))
          .flatMap(type=>(project.checklists?.[type]||[]).filter(i=>i.starred).map(i=>({...i,ifaceType:type})));
        const ic2 = t => INTERFACE_COLORS[t]||INTERFACE_COLORS.General;
        if(!allStarred.length) return (
          <div style={{textAlign:"center",padding:"48px 20px",color:"var(--color-text-tertiary)"}}>
            <div style={{fontSize:32,marginBottom:12}}>☆</div>
            <div style={{fontSize:14,fontWeight:500,marginBottom:6}}>No starred tasks yet</div>
            <div style={{fontSize:12}}>Star tasks in any checklist tab to pin them here for quick access during client calls.</div>
          </div>
        );
        const grouped = ALL_INTERFACE_ORDER.filter(t=>(project.interfaces||[]).includes(t)).map(t=>({type:t,items:allStarred.filter(i=>i.ifaceType===t)})).filter(g=>g.items.length>0);
        return (
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,background:"#fffbeb",border:"0.5px solid #fcd34d",borderRadius:"var(--border-radius-md)",padding:"8px 12px",marginBottom:16}}>
              <span style={{fontSize:13}}>⭐</span>
              <span style={{fontSize:12,color:"#92400e"}}><strong>{allStarred.length} starred task{allStarred.length!==1?"s":""}</strong> — click any item to mark it done, click ⭐ to unstar</span>
            </div>
            {grouped.map(({type,items})=>(
              <div key={type} style={{marginBottom:16}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}>
                  <span style={{fontSize:11,fontFamily:"var(--font-mono)",fontWeight:600,padding:"2px 8px",borderRadius:4,background:ic2(type).bg,color:ic2(type).text}}>{type}</span>
                  <span style={{fontSize:11,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}>{items.length} task{items.length!==1?"s":""}</span>
                </div>
                <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",overflow:"hidden"}}>
                  {items.map((item,idx)=>(
                    <div key={item.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:compact?"8px 12px":"11px 14px",borderBottom:idx<items.length-1?"0.5px solid var(--color-border-tertiary)":"none",background:"#fffbeb"}}>
                      <div onClick={()=>onToggle(project.id,type,item.id)} style={{width:15,height:15,borderRadius:3,flexShrink:0,marginTop:2,border:item.done?"none":"0.5px solid var(--color-border-primary)",background:item.done?ic2(type).text:"transparent",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                        {item.done&&<span style={{display:"inline-block",lineHeight:1,fontSize:9,color:"var(--color-background-primary)"}}>✓</span>}
                      </div>
                      <div onClick={()=>onToggle(project.id,type,item.id)} style={{flex:1,cursor:"pointer"}}>
                        <div style={{fontSize:compact?12:13,color:item.done?"var(--color-text-tertiary)":"var(--color-text-primary)",textDecoration:item.done?"line-through":"none",lineHeight:1.5}}>{item.label}</div>
                        <div style={{fontSize:10,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)",marginTop:2}}>{item.phase}</div>
                      </div>
                      <button onClick={()=>onStarItem(project.id,type,item.id)} title="Remove star" style={{background:"none",border:"none",cursor:"pointer",fontSize:12,padding:"1px 3px",flexShrink:0,marginTop:1}}>⭐</button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      })()}
      {tab==="overview"&&<OverviewTab project={project} compact={compact} onUpdate={onUpdate} onUpdatePhase={(p)=>onUpdatePhase(project.id,p)} />}
      {tab==="notes"&&<NotesTab project={project} engineer={engineer} setEngineer={setEngineer} compact={compact} onAddNote={onAddNote} />}
      {tab==="todo"&&<TodoTab project={project} compact={compact} onAdd={t=>onAddTodo(project.id,t)} onToggle={id=>onToggleTodo(project.id,id)} onDelete={id=>onDeleteTodo(project.id,id)} />}
    </div>
  );
}

// ─── NotesTab ──────────────────────────────────────────────────────────────────
function NotesTab({project,engineer,setEngineer,compact,onAddNote}) {
  const [newNote,     setNewNote]     = useState("");
  const [docInput,    setDocInput]    = useState("");
  const [pendingDocs, setPendingDocs] = useState([]);
  const [noteSearch,  setNoteSearch]  = useState("");
  const isOther = !ENGINEERS.includes(engineer);
  function addDoc(){ if(docInput.trim()){setPendingDocs([...pendingDocs,docInput.trim()]);setDocInput("");} }
  function submit(){ if(newNote.trim()){onAddNote(project.id,newNote.trim(),pendingDocs);setNewNote("");setPendingDocs([]);} }
  return (
    <div>
      <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:"14px",marginBottom:14}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
          <span style={{fontSize:11,color:"var(--color-text-secondary)"}}>Logging as:</span>
          <select value={isOther?"Other":engineer} onChange={e=>setEngineer(e.target.value==="Other"?"":e.target.value)} style={{fontSize:12,padding:"3px 6px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",cursor:"pointer"}}>
            {ENGINEERS.map(e=><option key={e}>{e}</option>)}
            <option value="Other">Other…</option>
          </select>
          {isOther&&<input value={engineer} onChange={e=>setEngineer(e.target.value)} placeholder="Your initials" style={{width:90,fontSize:12,padding:"3px 8px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",outline:"none"}} />}
        </div>
        <textarea value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="Log a note, client update, or communication…" style={{width:"100%",minHeight:compact?60:76,background:"transparent",border:"none",outline:"none",resize:"none",fontFamily:"var(--font-sans)",fontSize:13,color:"var(--color-text-primary)",lineHeight:1.6,padding:0}} />
        <div style={{borderTop:"0.5px solid var(--color-border-tertiary)",paddingTop:10,marginTop:8}}>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <input value={docInput} onChange={e=>setDocInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();addDoc();}}} placeholder="Tag a document sent (Enter)…" style={{flex:1,minWidth:180,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-md)",padding:"5px 10px",fontSize:12,color:"var(--color-text-primary)",outline:"none"}} list="doc-opts" />
            <datalist id="doc-opts">{[...new Set(Object.values(DOC_SUGGESTIONS).flat())].map(d=><option key={d} value={d} />)}</datalist>
            <button onClick={addDoc} style={{padding:"5px 10px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",fontSize:12,cursor:"pointer",color:"var(--color-text-secondary)",whiteSpace:"nowrap"}}>Add</button>
            <button onClick={submit} style={{padding:"5px 14px",border:"none",borderRadius:"var(--border-radius-md)",background:newNote.trim()?"var(--color-background-info)":"var(--color-background-secondary)",fontSize:12,cursor:newNote.trim()?"pointer":"default",color:newNote.trim()?"var(--color-text-info)":"var(--color-text-tertiary)",fontWeight:500,opacity:newNote.trim()?1:0.5,whiteSpace:"nowrap"}} disabled={!newNote.trim()}>Log note ↗</button>
          </div>
          {pendingDocs.length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>{pendingDocs.map((d,i)=><span key={i} onClick={()=>setPendingDocs(pendingDocs.filter((_,j)=>j!==i))} style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"var(--color-background-success)",color:"var(--color-text-success)",cursor:"pointer"}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>📎</span>{d} ×</span>)}</div>}
        </div>
      </div>
      {/* Notes search */}
      {(project.notes||[]).length>2 && (
        <div style={{display:"flex",alignItems:"center",gap:8,background:"var(--color-background-secondary)",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",padding:"6px 10px",marginBottom:12}}>
          <span style={{fontSize:12,color:"var(--color-text-tertiary)",flexShrink:0}}>🔍</span>
          <input value={noteSearch} onChange={e=>setNoteSearch(e.target.value)} placeholder="Search notes…" style={{background:"transparent",border:"none",outline:"none",fontSize:12,color:"var(--color-text-primary)",width:"100%"}} />
          {noteSearch&&(
            <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
              <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)"}}>{[...(project.notes||[])].filter(n=>n.text?.toLowerCase().includes(noteSearch.toLowerCase())||(n.author||"").toLowerCase().includes(noteSearch.toLowerCase())||(n.docs||[]).join(" ").toLowerCase().includes(noteSearch.toLowerCase())).length} of {project.notes.length}</span>
              <button onClick={()=>setNoteSearch("")} style={{background:"none",border:"none",cursor:"pointer",color:"var(--color-text-tertiary)",fontSize:12,padding:0}}>✕</button>
            </div>
          )}
        </div>
      )}
      {(()=>{
        const allNotes = [...(project.notes||[])].reverse();
        const filtered = noteSearch
          ? allNotes.filter(n=>
              n.text?.toLowerCase().includes(noteSearch.toLowerCase()) ||
              (n.author||"").toLowerCase().includes(noteSearch.toLowerCase()) ||
              (n.docs||[]).join(" ").toLowerCase().includes(noteSearch.toLowerCase())
            )
          : allNotes;
        if (!filtered.length) return (
          <div style={{textAlign:"center",padding:"36px 0",color:"var(--color-text-tertiary)",fontSize:12}}>
            {noteSearch ? `No notes match "${noteSearch}"` : "No notes yet."}
          </div>
        );
        return filtered.map(note=>(
          <div key={note.id} style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",padding:compact?"10px":"13px",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:"var(--color-background-info)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontFamily:"var(--font-mono)",fontWeight:500,color:"var(--color-text-info)",flexShrink:0}}>{note.author||"?"}</div>
              <span style={{fontSize:11,color:"var(--color-text-tertiary)",fontFamily:"var(--font-mono)"}}>{new Date(note.date).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</span>
            </div>
            <p style={{margin:0,fontSize:13,color:"var(--color-text-primary)",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{note.text}</p>
            {(note.docs||[]).length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:8}}>{note.docs.map((d,i)=><span key={i} style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:"var(--color-background-success)",color:"var(--color-text-success)"}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>📎</span>{d}</span>)}</div>}
          </div>
        ));
      })()}
    </div>
  );
}

// ─── TodoTab ───────────────────────────────────────────────────────────────────
function TodoTab({project,compact,onAdd,onToggle,onDelete}) {
  const [input,setInput]=useState("");
  const todos=project.todos||[];
  const pending=todos.filter(t=>!t.done);
  const done=todos.filter(t=>t.done);
  function handleAdd(){ if(input.trim()){onAdd(input.trim());setInput("");} }
  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")handleAdd();}} placeholder="Add a custom task for this project…" style={{flex:1,fontSize:13,padding:"8px 12px",border:"0.5px solid var(--color-border-secondary)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",outline:"none"}} />
        <button onClick={handleAdd} style={{padding:"8px 16px",border:"none",borderRadius:"var(--border-radius-md)",background:"var(--color-background-info)",color:"var(--color-text-info)",fontSize:12,cursor:"pointer",fontWeight:500,flexShrink:0}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>+</span> Add</button>
      </div>
      {!todos.length&&<div style={{textAlign:"center",padding:"36px 0",color:"var(--color-text-tertiary)"}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>☑</span><div style={{fontSize:12}}>No custom tasks yet.</div></div>}
      {pending.length>0&&(
        <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",overflow:"hidden",marginBottom:12}}>
          {pending.map((todo,idx)=>(
            <div key={todo.id} style={{display:"flex",alignItems:"center",gap:10,padding:compact?"8px 12px":"11px 14px",borderBottom:idx<pending.length-1?"0.5px solid var(--color-border-tertiary)":"none"}}>
              <div onClick={()=>onToggle(todo.id)} style={{width:15,height:15,borderRadius:3,flexShrink:0,border:"0.5px solid var(--color-border-primary)",background:"transparent",cursor:"pointer"}} />
              <span style={{flex:1,fontSize:compact?12:13,color:"var(--color-text-primary)",lineHeight:1.5,cursor:"pointer"}} onClick={()=>onToggle(todo.id)}>{todo.text}</span>
              <button onClick={()=>onDelete(todo.id)} style={{background:"none",border:"none",color:"var(--color-text-tertiary)",cursor:"pointer",padding:"2px 4px",borderRadius:4,fontSize:12,flexShrink:0}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✕</span></button>
            </div>
          ))}
        </div>
      )}
      {done.length>0&&(
        <div>
          <div style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:7,display:"flex",alignItems:"center",gap:5}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✅</span> Done ({done.length})</div>
          <div style={{background:"var(--color-background-primary)",border:"0.5px solid var(--color-border-tertiary)",borderRadius:"var(--border-radius-lg)",overflow:"hidden"}}>
            {done.map((todo,idx)=>(
              <div key={todo.id} style={{display:"flex",alignItems:"center",gap:10,padding:compact?"8px 12px":"11px 14px",borderBottom:idx<done.length-1?"0.5px solid var(--color-border-tertiary)":"none"}}>
                <div onClick={()=>onToggle(todo.id)} style={{width:15,height:15,borderRadius:3,flexShrink:0,border:"none",background:"var(--color-text-success)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✓</span></div>
                <span style={{flex:1,fontSize:compact?12:13,color:"var(--color-text-tertiary)",textDecoration:"line-through",cursor:"pointer"}} onClick={()=>onToggle(todo.id)}>{todo.text}</span>
                <button onClick={()=>onDelete(todo.id)} style={{background:"none",border:"none",color:"var(--color-text-tertiary)",cursor:"pointer",padding:"2px 4px",borderRadius:4,fontSize:12,flexShrink:0}}><span aria-hidden="true" style={{display:"inline-block",lineHeight:1}}>✕</span></button>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


// ─── OverviewTab ───────────────────────────────────────────────────────────────
const ROLE_SUGGESTIONS = [
  "Clinical Lead","IT / EHR Contact","Network Engineer","Registration Staff",
  "Billing Department Rep","HIM Rep","Interface Contact","Project Manager",
  "Implementations Contact","Facility Admin",
];

const PORT_COLS = [
  {key:"test",      label:"Test"},
  {key:"testRelay", label:"Test — Relay"},
  {key:"prod",      label:"Prod"},
  {key:"prodRelay", label:"Prod — Relay"},
];

function OverviewTab({project,compact,onUpdate,onUpdatePhase}) {
  const [editing,      setEditing]      = useState(null);
  const [val,          setVal]          = useState("");
  const [editContact,  setEditContact]  = useState(null); // contact id being edited, or "new"
  const [contactForm,  setContactForm]  = useState({name:"",role:"",email:"",phone:""});
  const [copiedCell,   setCopiedCell]   = useState(null); // "iface-col" for flash

  const pid      = project.id;
  const ports    = project.ports    || {};
  const contacts = project.contacts || [];
  const ifaceRows = (project.interfaces||[]).filter(t=>t!=="General");

  // ── Inline text field helpers ─────────────────────────────────────────────
  function startEdit(key, current) { setEditing(key); setVal(current||""); }
  function commitEdit(key) { if(editing===key){ onUpdate(pid,{[key]:val}); setEditing(null); } }
  function handleKey(e, key) {
    if(e.key==="Enter"){ e.preventDefault(); commitEdit(key); }
    if(e.key==="Escape") setEditing(null);
  }

  const field = (key, label, placeholder="click to add") => {
    const current = project[key]||"";
    const isEdit  = editing===key;
    return (
      <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
        <span style={{fontSize:10,fontFamily:"var(--font-mono)",color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:"0.05em"}}>{label}</span>
        {isEdit
          ? <input autoFocus value={val} onChange={e=>setVal(e.target.value)}
              onBlur={()=>commitEdit(key)} onKeyDown={e=>handleKey(e,key)}
              style={{fontSize:13,padding:"5px 8px",border:"0.5px solid var(--color-border-info)",borderRadius:"var(--border-radius-md)",background:"var(--color-background-secondary)",color:"var(--color-text-primary)",outline:"none",width:"100%"}} />
          : <div onClick={()=>startEdit(key,current)} title="Click to edit"
              style={{fontSize:13,color:current?"var(--color-text-primary)":"var(--color-text-tertiary)",cursor:"text",padding:"5px 8px",borderRadius:"var(--border-radius-md)",border:"0.5px solid transparent",minHeight:28,display:"flex",alignItems:"center",transition:"border 0.12s"}}
              onMouseEnter={e=>e.currentTarget.style.border="0.5px solid var(--color-border-secondary)"}
              onMouseLeave={e=>e.currentTarget.style.border="0.5px solid transparent"}>
              {current||<span style={{fontStyle:"italic",fontSize:12}}>{placeholder}</span>}
            </div>
        }
      </div>
    );
  };
